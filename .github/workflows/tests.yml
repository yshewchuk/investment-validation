name: Tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Sharded: `plan` selects the PR's test files once and prints the shard matrix
# (tests/shards.toml via tools/ci_shards.py), `shard` runs one matrix job per
# shard, and `test` is the aggregator. The ruleset's required check is still
# named `test`; it fails unless plan and every shard job succeeded.
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request: full history, so the changed-file diff below can
          # reach the PR's base commit. Others: default shallow checkout.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || 1 }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"

      - name: Select PR test files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          CHANGED_FILE="$RUNNER_TEMP/pr-changed-files.txt"
          git diff -z --no-renames --name-only "$BASE_SHA"...HEAD > "$CHANGED_FILE"
          python3 tools/mutation_pilot.py select-tests --changed-files "$CHANGED_FILE" \
            --base-sha "$BASE_SHA" \
            > "$RUNNER_TEMP/pr-test-selection.txt"

      - name: Check test layout ratchet
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 checks/test_layout_budget.py --base-ref "$BASE_SHA"

      - name: Upload PR test selection
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-selection
          path: ${{ runner.temp }}/pr-test-selection.txt
          if-no-files-found: error

      - name: Print shard matrix
        id: matrix
        run: echo "matrix=$(python3 tools/ci_shards.py matrix)" >> "$GITHUB_OUTPUT"

  shard:
    name: tests (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || 1 }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install pre-commit hook
        run: |
          python checks/install_hooks.py

      - name: Download PR test selection
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: pr-test-selection
          path: ${{ runner.temp }}

      - name: Run pytest
        env:
          SHARD: ${{ matrix.shard }}
          # Empty ('') for push/workflow_dispatch: tools/ci_shards.py then
          # prints the shard's whole file list.
          SELECTION_FILE: ${{ github.event_name == 'pull_request' && format('{0}/pr-test-selection.txt', runner.temp) || '' }}
        run: |
          set -euo pipefail
          SEL=()
          if [ -n "$SELECTION_FILE" ]; then
            SEL=(--selection "$SELECTION_FILE")
          fi
          mapfile -t FILES < <(python3 tools/ci_shards.py files "$SHARD" "${SEL[@]}")
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No test files selected for shard $SHARD; skipping pytest."
            exit 0
          fi
          python -m pytest -n auto --dist loadgroup -m "not needs_data and not needs_corpus and not heavy_host and not browser" -rfE --durations=25 --junitxml=junit.xml "${FILES[@]}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-${{ matrix.shard }}
          path: junit.xml
          if-no-files-found: warn

  test:
    needs: [plan, shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require the plan and every shard to have succeeded
        run: |
          echo "plan=${{ needs.plan.result }} shard=${{ needs.shard.result }}"
          if [ "${{ needs.plan.result }}" != "success" ] || [ "${{ needs.shard.result }}" != "success" ]; then
            echo "A shard failed, was cancelled or was skipped." >&2
            exit 1
          fi
