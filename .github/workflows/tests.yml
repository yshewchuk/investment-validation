name: Tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request: full history, so the changed-file diff below can
          # reach the PR's base commit (same shape
          # .github/workflows/mutation.yml's plan job already uses).
          # push/schedule/workflow_dispatch: unchanged default shallow
          # checkout (depth 1).
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || 1 }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install pre-commit hook
        run: |
          python checks/install_hooks.py

      - name: Select PR test files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          CHANGED_FILE="$RUNNER_TEMP/pr-changed-files.txt"
          git diff -z --no-renames --name-only "$BASE_SHA"...HEAD > "$CHANGED_FILE"
          python3 tools/mutation_pilot.py select-tests --changed-files "$CHANGED_FILE" \
            --base-sha "$BASE_SHA" \
            > "$RUNNER_TEMP/pr-test-selection.txt"

      - name: Check test layout ratchet
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 checks/test_layout_budget.py --base-ref "$BASE_SHA"

      - name: Run pytest
        env:
          # Empty ('') for push/schedule/workflow_dispatch: the "Select PR
          # test files" step above didn't run, so TARGETS below falls back
          # to tests/, byte-identical to before this job could narrow
          # anything.
          SELECTION_FILE: ${{ github.event_name == 'pull_request' && format('{0}/pr-test-selection.txt', runner.temp) || '' }}
        run: |
          set -euo pipefail
          TARGETS=("tests/")
          if [ -n "$SELECTION_FILE" ]; then
            mapfile -t SELECTED < "$SELECTION_FILE"
            if [ "${#SELECTED[@]}" -eq 0 ]; then
              echo "No test files selected for this PR's diff; skipping pytest."
              exit 0
            elif [ "${SELECTED[0]}" = "__ALL__" ]; then
              TARGETS=("tests/")
            else
              TARGETS=("${SELECTED[@]}")
            fi
          fi
          python -m pytest -n auto --dist loadgroup -m "not needs_data and not needs_corpus and not heavy_host and not browser" -rfE --durations=25 --junitxml=junit.xml "${TARGETS[@]}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: junit.xml
          if-no-files-found: warn
