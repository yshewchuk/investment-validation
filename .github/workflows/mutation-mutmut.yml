# Mutation testing (mutmut), report only -- the second, INDEPENDENT backend.
# Guide: tests/README.md, "Mutation CI".
#
# The gremlins workflow (.github/workflows/mutation.yml) is unchanged: it owns
# the `mutation` name, the `mutation-report` aggregate artifact (what
# tools/mutation_report.py reads by default) and the `mutation-gremlins-*`
# concurrency/cache namespaces. This workflow is the mutmut re-addition of
# 07a7974, adapted to coexist with it: every shared resource carries a
# `mutation-mutmut` prefix, so a run of one backend never blocks, overwrites or
# is merged into the other's results.
#
# PR runs never start on their own: like the gremlins workflow, this file has
# no `pull_request` trigger. It listens for `workflow_run: workflows: [Tests]`
# instead, gated (in the plan job's `if:`) on that Tests run having succeeded
# and having itself been a pull_request run for a PR in this same repository.
# See mutation.yml's own header comment ("PR context: workflow_run") for the
# full rationale (why mutation used to starve Tests for account-wide runners,
# why workflow_run.pull_requests can list a fork PR alongside a same-repo one
# and how the "Select the triggering PR" step resolves the real PR from it
# (base.repo.id + head.sha, never a join() over the raw array), what
# running in the base repository's context does and does not isolate this job
# from, and why this gate applies to every qualifying Tests completion once
# this file's change reaches main, including for PRs opened before that).
# `.github/workflows/cancel-stale-runs.yml` cancels a leftover run of
# this workflow (or Tests, or mutation.yml) when its PR closes first.
#
# Behavior (same shape as the gremlins workflow, mutmut's own state model):
# - push to main: incremental. Each module restores its newest cached mutmut
#   state (*.meta verdicts, mutmut-stats.json, the driver's test digest) and
#   re-tests only functions whose source changed (plus survived/no-tests
#   verdicts, when the module's tests changed). mutmut 3 keeps verdicts whose
#   function hash is unchanged, so a cache hit skips finished mutants. A
#   push's own run also cancels an older still-running push run on main (see
#   concurrency below), so a rapid string of merges cannot queue behind itself.
# - weekly schedule (staggered after the gremlins full run), and
#   workflow_dispatch by default: full, from scratch (no restore: the runner
#   starts without state, so every mutant is re-decided). Dispatch with
#   fresh=false for an incremental run, and `modules` for a subset. Neither
#   cancels a same-kind run in progress (see concurrency below).
# - Scores never fail a job. A job fails ONLY when the tool does: a nonzero
#   mutmut exit code (clean-run or worker failure), a step timeout, or an
#   export that cannot read the module's state. Survivors/score are
#   report-only. Every module job uploads report/<module>/ (results.jsonl,
#   summary.json, summary.md) as `mutation-mutmut-module-<module>`; the
#   `report` job merges every module into one `mutation-mutmut-report`
#   artifact. Like the gremlins `report` job it does so even when the merge
#   exits nonzero: merge's rc is captured, the summary it did write is
#   appended, the artifact is uploaded with always(), and only then does the
#   job fail on that rc.
# - The merge is given the plan's module list (--expected-modules) and is
#   called even when ZERO module artifacts were downloaded, because a matrix
#   job that died before its export/upload would otherwise leave a subset that
#   publishes as a valid full run: a missing, extra or duplicated module set,
#   or a module whose recorded run_exit_code is nonzero (a step-timeout kill
#   is -1, and the step gate that exports it has no rc file to read, so -1 is
#   exactly what it records), makes merge write an incomplete tool-error
#   artifact (never a clean-looking or half-run report) and exit nonzero, so
#   `mutation-mutmut-report` can only ever describe the whole planned run.
#
# mutmut needs no cache fingerprint of its own beyond the key below: its state
# is keyed by the backend version, Python, the per-module config-hash (see the
# "key" step below) and the module, and every function's verdict is validated
# against that function's source hash inside the restored state, so changed
# code is re-tested even on a cache hit.
name: mutation-mutmut

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
  schedule:
    - cron: "23 22 * * 0"  # Sundays 22:23 UTC: full run, staggered after the gremlins one
  workflow_dispatch:
    inputs:
      fresh:
        description: "Full run from scratch (skip the cache restore). Untick for incremental."
        type: boolean
        default: true
      modules:
        description: "Comma-separated module subset (empty: every enabled module)"
        type: string
        default: ""

permissions:
  contents: read

# Separate from the gremlins group (mutation-gremlins-...), so a mutmut run
# never queues behind -- or cancels -- a gremlins run on the same ref.
concurrency:
  # Mirrors mutation.yml's own concurrency block exactly (see there for the
  # full rationale) with the mutation-mutmut prefix: three disjoint groups,
  # one per trigger family. workflow_run groups by head_repository.full_name
  # + head_branch + workflow_run.event -- NEVER by PR number: `.*`/join()
  # over `workflow_run.pull_requests` treats it as "exactly one same-repo
  # PR", but the array is populated by head BRANCH NAME across every
  # repository, so a fork PR sharing a same-repo PR's branch name can land in
  # it too. head_repository.full_name + head_branch already uniquely
  # identifies the branch that triggered THIS run without touching that
  # array (a branch is the head of at most one open PR at a time in its own
  # repo), and head_repository.full_name is required because head_branch
  # alone carries no owner/fork identity -- the group is resolved before the
  # fork gate (the plan job's `if:`) ever runs. push to main gets its own
  # cancelling group, never shared with schedule/dispatch (whose github.ref
  # is identical to push's on main -- the three used to collide in one
  # `refs/heads/main` group, so a merge could cancel a running Sunday full
  # run or a dispatched run). schedule and workflow_dispatch keep their own
  # shared, ref-based, non-cancelling group, byte-identical in shape to what
  # every trigger used before this change.
  group: mutation-mutmut-${{ github.event_name == 'push' && format('push-{0}', github.ref) || github.event_name == 'workflow_run' && format('{0}-{1}-{2}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch, github.event.workflow_run.event) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' || github.event_name == 'push' }}

env:
  # The phase-0 environment lock (requirements.txt header: "python 3.14.4").
  # mutmut 3.8.0 supports Python 3.14 (the mutmut era of mutation CI ran on it).
  PYTHON_VERSION: "3.14.4"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  plan:
    # See mutation.yml's plan job for the identical rationale: push/schedule/
    # dispatch are unaffected; a workflow_run event only proceeds when the
    # Tests run it followed succeeded, was itself a pull_request run, and
    # that Tests run itself executed in this repository. Which PR triggered
    # it is resolved separately, below, by "Select the triggering PR" --
    # never by treating workflow_run.pull_requests as "exactly one same-repo
    # PR" (see mutation.yml's header for why that array can't be trusted
    # that way).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # See mutation.yml's plan job for why pull-requests:read is granted
    # explicitly here (for the "PR still open?" gh api call below) rather
    # than assumed from the workflow-level contents:read block.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      modules: ${{ steps.plan.outputs.modules }}
      mode: ${{ steps.plan.outputs.mode }}
      mutmut: ${{ steps.plan.outputs.mutmut }}
      pr_number: ${{ steps.select_pr.outputs.number }}
      base_sha: ${{ steps.select_pr.outputs.base_sha }}
    steps:
      # See mutation.yml's plan job "Select the triggering PR" step for the
      # identical rationale and jq filter: resolves the one
      # workflow_run.pull_requests entry that both targets this repository
      # (base.repo.id) and shares this run's head commit (head.sha).
      # Zero or multiple matches leave number/base_sha empty, which the
      # `pr_open` step below (and the `plan` step's PR_OPEN check) treats
      # exactly like a closed PR -- an empty, explicitly-valid plan, never a
      # job failure. $PULL_REQUESTS_JSON is passed through env, never
      # interpolated into the script. `.base.repo.id`, never
      # `.base.repo.full_name`: the pull-request-minimal object GitHub
      # actually puts in this array carries only `id`/`name`/`url` on
      # `base.repo` -- no `full_name` field exists, so a filter on it can
      # never match anything (see mutation.yml's own comment and
      # tests/fixtures/workflow_run_pull_requests.json, captured from a real
      # payload). Compared as a NUMBER via `--argjson`, never `--arg`, since
      # `.base.repo.id` in the payload is a JSON number.
      - name: Select the triggering PR
        id: select_pr
        if: github.event_name == 'workflow_run'
        env:
          PULL_REQUESTS_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          REPO_ID: ${{ github.repository_id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          FILTER='[.[] | select(.base.repo.id == $repo_id and .head.sha == $sha)]'
          selected=$(jq -c --argjson repo_id "$REPO_ID" --arg sha "$HEAD_SHA" "$FILTER" <<< "$PULL_REQUESTS_JSON")
          count=$(jq 'length' <<< "$selected")
          if [ "$count" != "1" ]; then
            echo "::notice::${count} workflow_run.pull_requests entries matched base.repo.id=$REPO_ID head.sha=$HEAD_SHA (need exactly 1) -- skipping mutation for this run."
            echo "number=" >> "$GITHUB_OUTPUT"
            echo "base_sha=" >> "$GITHUB_OUTPUT"
          else
            echo "number=$(jq -r '.[0].number' <<< "$selected")" >> "$GITHUB_OUTPUT"
            echo "base_sha=$(jq -r '.[0].base.sha' <<< "$selected")" >> "$GITHUB_OUTPUT"
          fi
      # See mutation.yml's plan job for the identical rationale: the job
      # `if:` above only proves the PR was open when its Tests run STARTED,
      # not when this workflow_run (fired on Tests' completion) actually
      # runs -- and, now, that `select_pr` resolved exactly one PR at all.
      - name: Check the triggering PR is still open
        id: pr_open
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.select_pr.outputs.number }}
        run: |
          set -euo pipefail
          if [ -z "$PR_NUMBER" ]; then
            echo "open=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          state=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.state')
          open=false
          [ "$state" = "open" ] && open=true
          echo "open=$open" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.pr_open.outputs.open != 'false'
        with:
          # workflow_run: the PR's own head commit, never the default branch
          # a plain checkout would give this event. push/schedule/dispatch:
          # '' means "use the default for this event", byte-identical to the
          # old unpinned checkout.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          # workflow_run (a PR run): full history for the changed-file diff
          # below; push/schedule/dispatch keep the default shallow checkout
          # (depth 1) -- byte-identical to before.
          fetch-depth: ${{ github.event_name == 'workflow_run' && '0' || 1 }}
      - uses: actions/setup-python@v5
        if: steps.pr_open.outputs.open != 'false'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: plan
        # Always runs -- see mutation.yml's plan job for why: a closed PR
        # must still leave `modules` explicitly '[]', never unset.
        env:
          # Remapped so every check below ("$EVENT" = "pull_request") keeps
          # meaning "this is a PR run" unchanged: a workflow_run event that
          # reached this step (the job `if:` above already required it to be
          # a successful PR Tests run) reads here as "pull_request", exactly
          # as a direct pull_request-triggered run used to.
          EVENT: ${{ github.event_name == 'workflow_run' && 'pull_request' || github.event_name }}
          FRESH: ${{ inputs.fresh }}
          ONLY: ${{ inputs.modules }}
          PR_OPEN: ${{ steps.pr_open.outputs.open }}
          # workflow_run: the base sha `select_pr` already resolved for the
          # one PR that actually triggered this run (never the raw
          # pull_requests array -- see that step).
          BASE_SHA: ${{ github.event_name == 'workflow_run' && steps.select_pr.outputs.base_sha || github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The PR closed/merged between its Tests run starting and this
          # workflow_run firing: emit an empty, explicitly-valid plan and
          # stop -- `mutate` and `report` both skip on modules == '[]'.
          if [ "$PR_OPEN" = "false" ]; then
            echo "modules=[]" >> "$GITHUB_OUTPUT"
            echo "mode=incremental" >> "$GITHUB_OUTPUT"
            echo "mutmut=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "push" ] || [ "$EVENT" = "pull_request" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$FRESH" = "false" ]; }; then
            mode=incremental
          else
            mode=full
          fi
          mutmut=$(sed -n 's/^mutmut==\([^ ]*\).*/\1/p' requirements-dev.txt)
          test -n "$mutmut"
          # pull_request only: narrow the matrix to the modules the PR's diff
          # can actually affect, mirroring the gremlins workflow's plan job
          # (see its comment for the full selection rule: module ownership,
          # else the docs-only inert allowlist, else every enabled module).
          # -z pairs with a NUL-splitting reader so a non-ASCII changed path
          # is not quoted. push/schedule/dispatch never set CHANGED_ARGS, so
          # the matrix command below stays byte-identical to before.
          CHANGED_ARGS=""
          if [ "$EVENT" = "pull_request" ]; then
            CHANGED_FILE="$RUNNER_TEMP/pr-changed-files.txt"
            git diff -z --no-renames --name-only "$BASE_SHA"...HEAD > "$CHANGED_FILE"
            CHANGED_ARGS="--changed-files $CHANGED_FILE"
          fi
          # Assign in its own command, never inside the echo: the exit status of
          # `echo "modules=$(...)"` is echo's, so a failing matrix command would
          # write an empty module list and the step would still pass. Under
          # `set -e` a command substitution in a plain assignment does abort, and
          # `mutation_pilot.py matrix --only ,` refuses instead of emitting the
          # empty matrix that would silently skip the whole matrix job.
          modules=$(python3 tools/mutation_pilot.py matrix --only "$ONLY" $CHANGED_ARGS)
          {
            echo "modules=$modules"
            echo "mode=$mode"
            echo "mutmut=$mutmut"
          } >> "$GITHUB_OUTPUT"

  mutate:
    needs: plan
    # plan.result == 'success' first: plan's own `if:` above can SKIP it
    # (fork PR, unsuccessful/non-PR workflow_run), and a skipped job's
    # outputs are unset, not '[]' -- checking outputs.modules alone would
    # then read '' != '[]' as true and start the matrix with no plan behind
    # it.
    if: needs.plan.result == 'success' && needs.plan.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # See mutation.yml's mutate job for why pull-requests:read is granted
    # explicitly (for this job's own "PR still open?" check below).
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.modules) }}
    env:
      MODULE: ${{ matrix.module }}
      MODE: ${{ needs.plan.outputs.mode }}
      # tools/mutation_pilot.py's default home; the cache paths below match it.
      STATE: ~/.cache/investing-plan-mutation-pilot/${{ matrix.module }}/mutants
    steps:
      # See mutation.yml's mutate job for the identical rationale: a queued
      # matrix job can outlive the PR that scheduled it, and this lets it
      # exit in seconds instead of running a full mutation pass for nothing.
      # Reuses `needs.plan.outputs.pr_number` -- already resolved and
      # validated by plan's "Select the triggering PR" step -- rather than
      # re-deriving it from the raw pull_requests array a second time.
      - name: Check the triggering PR is still open
        id: pr_open
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
        run: |
          set -euo pipefail
          state=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.state')
          open=false
          [ "$state" = "open" ] && open=true
          echo "open=$open" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.pr_open.outputs.open != 'false'
        with:
          fetch-depth: 0  # the push's base commit, to find the functions it changed
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      - id: py
        if: steps.pr_open.outputs.open != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # No cache under workflow_run -- see mutation.yml's mutate job for
          # why: this job runs the PR's own code in the base repository's
          # Actions context, and a cache save would write into main's shared
          # pip cache scope under a PR-controlled key. Empty disables both
          # restore and save; push/schedule/dispatch are unaffected.
          cache: ${{ github.event_name != 'workflow_run' && 'pip' || '' }}
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - if: steps.pr_open.outputs.open != 'false'
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - id: key
        if: steps.pr_open.outputs.open != 'false'
        run: |
          set -euo pipefail
          # Assigned before the echo, never interpolated inside it: the exit
          # status of `echo "...=$(...)"` is echo's, so a failing config-hash
          # would write a truncated prefix and the step would still pass.
          #
          # Per-module, not the whole-file hashFiles this replaced: hashing the
          # whole toml busted every module's cache on any one module's edit
          # (measured: PR #17 cold-started all 34 jobs). config-hash covers only
          # [defaults] plus this module's own section, so an edit to one
          # module's section restarts only that module.
          ch=$(python3 tools/mutation_pilot.py config-hash "$MODULE")
          echo "prefix=mutation-mutmut${{ needs.plan.outputs.mutmut }}-py${{ steps.py.outputs.python-version }}-${ch}-${{ matrix.module }}-" >> "$GITHUB_OUTPUT"
      # Only mutmut's state is cached -- a namespace fully separate from the
      # gremlins workflow's .gremlins_cache keys (mutation-gremlins...):
      # per-file verdicts and function hashes (*.meta), test stats and the
      # driver's test digest. The work copy and the mutated files are rebuilt
      # from the checkout; unchanged functions keep their verdicts because
      # mutmut compares function hashes, not mtimes, once the mutated file is
      # missing. A full run skips this restore and so starts from scratch.
      - name: Restore mutmut state
        if: needs.plan.outputs.mode == 'incremental' && steps.pr_open.outputs.open != 'false'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.STATE }}/**/*.meta
            ${{ env.STATE }}/mutmut-stats.json
            ${{ env.STATE }}/mutation-ci-state.json
          key: ${{ steps.key.outputs.prefix }}${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.key.outputs.prefix }}
      - name: Run mutmut
        id: run
        if: steps.pr_open.outputs.open != 'false'
        timeout-minutes: ${{ needs.plan.outputs.mode == 'incremental' && 60 || 330 }}
        run: |
          set -euo pipefail
          date +%s > "$RUNNER_TEMP/mutation-start"
          set +e
          if [ "$MODE" = "incremental" ]; then BUDGET=$((52 * 60)); else BUDGET=$((322 * 60)); fi
          python -u tools/mutation_pilot.py run "$MODULE" --max-children "$(nproc)" --time-budget-seconds "$BUDGET"
          echo "$?" > "$RUNNER_TEMP/mutation-rc"
          set -e
      - name: Export report
        if: always() && steps.key.outcome == 'success'
        env:
          # PRs use the PR base SHA as the change window base (github.event.before
          # only exists on push). workflow_run: plan's own `select_pr`
          # output, never the raw pull_requests array.
          BEFORE: ${{ github.event_name == 'push' && github.event.before || (github.event_name == 'workflow_run' && needs.plan.outputs.base_sha || '') }}
        run: |
          set -euo pipefail
          rc=$(cat "$RUNNER_TEMP/mutation-rc" 2>/dev/null || echo -1)  # -1: killed by the step timeout
          start=$(cat "$RUNNER_TEMP/mutation-start" 2>/dev/null || date +%s)
          # set -e: mutation_results.py export is the gate for a module whose
          # state cannot be read at all; a nonzero mutmut rc still writes an
          # honest partial artifact (run_exit_code recorded) and is failed on
          # below. Survivors/score never exit nonzero.
          python tools/mutation_results.py export "$MODULE" --out "report/$MODULE" --mode "$MODE" \
            ${BEFORE:+--changed-base "$BEFORE"} --run-exit-code "$rc" --elapsed "$(( $(date +%s) - start ))"
          cat "report/$MODULE/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outcome == 'success'
        with:
          name: mutation-mutmut-module-${{ matrix.module }}
          path: report/${{ matrix.module }}/
          retention-days: 90
          if-no-files-found: warn
      # Saved even after a timeout, so the next run resumes the partial state.
      # Never on a PR's gated workflow_run: a PR run must not overwrite main's
      # incremental state cache (the key carries no PR number), so saving is
      # skipped entirely for PRs and main's cache stays untouched.
      - name: Save mutmut state
        if: always() && steps.key.outcome == 'success' && github.event_name != 'workflow_run'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.STATE }}/**/*.meta
            ${{ env.STATE }}/mutmut-stats.json
            ${{ env.STATE }}/mutation-ci-state.json
          key: ${{ steps.key.outputs.prefix }}${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Fail only on a tool error, never on scores
        if: always() && steps.key.outcome == 'success'
        run: |
          rc=$(cat "$RUNNER_TEMP/mutation-rc" 2>/dev/null || echo -1)
          if [ "$rc" = "124" ] && [ "$MODE" = "incremental" ]; then
            echo "::notice::mutmut run hit the per-push time box; module is INCOMPLETE (TIME_BUDGET_STOP), not a tool error"
            exit 0
          fi
          if [ "$rc" != 0 ]; then echo "::error::mutmut run exited $rc"; exit 1; fi

  report:
    needs: [plan, mutate]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.modules != '[]'
    runs-on: ubuntu-latest
    env:
      # The plan's module list, passed to merge as a variable (never interpolated
      # into the script text), so a module set that is not exactly the one the
      # plan scheduled cannot be published as a valid full run.
      EXPECTED_MODULES: ${{ needs.plan.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-mutmut-module-*
          path: modules
      - name: Merge module reports
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(modules/mutation-mutmut-module-*)
          if [ ${#dirs[@]} -eq 0 ]; then
            # Not "nothing to do, pass": the plan expected modules and none of
            # them uploaded. merge is called with no input directories, writes an
            # incomplete diagnostic artifact against EXPECTED_MODULES, and exits
            # nonzero -- the job fails in the gate step below.
            echo "::warning::no mutation-mutmut-module-* artifacts were downloaded; merging against the expected module list anyway"
          fi
          # Capture merge's rc, do NOT let `set -e` skip the rest: merge writes a
          # diagnostic summary and then exits nonzero when a module is missing,
          # unexpected, duplicated, its inputs are not one run, or a module's
          # run exited nonzero (partial results; a timeout is -1). The
          # consolidated artifact and that summary are the whole point of the
          # report job, so they must survive the nonzero rc; the job fails on it
          # only in the gate step below.
          set +e
          python tools/mutation_results.py merge --out merged \
            --expected-modules "$EXPECTED_MODULES" "${dirs[@]}"
          echo "$?" > "$RUNNER_TEMP/mutmut-merge-rc"
          set -e
          if [ -f merged/summary.md ]; then
            cat merged/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$(cat "$RUNNER_TEMP/mutmut-merge-rc")
            # No summary means nothing was consolidated: that is a failure even
            # when merge's own exit code said otherwise.
            if [ "$rc" = 0 ]; then
              echo "::error::merge exited 0 but wrote no merged/summary.md"
              echo 1 > "$RUNNER_TEMP/mutmut-merge-rc"
            fi
          fi
      # always(): the partial/failed merge output is exactly what triage needs,
      # so the artifact goes up whether or not the merge succeeded.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-mutmut-report
          path: merged/
          retention-days: 90
          if-no-files-found: warn
      - name: Fail only on a merge error, never on scores
        if: always()
        run: |
          rc=$(cat "$RUNNER_TEMP/mutmut-merge-rc" 2>/dev/null || echo -1)
          if [ "$rc" != 0 ]; then echo "::error::report merge exited $rc"; exit 1; fi
