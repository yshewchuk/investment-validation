# Mutation testing (pytest-gremlins), report only -- the ACTIVE gremlins
# workflow. It runs ALONGSIDE the independent mutmut workflow
# (.github/workflows/mutation-mutmut.yml), not instead of it; every shared
# resource is namespaced per backend, so a run of one never blocks, overwrites
# or merges into the other. tools/gremlin_workflow_candidate.yml mirrors these
# exact bytes and is the copy the gremlins CI tests parse.
#
# Behavior shared with the mutmut workflow it coexists with:
# - PR runs never start on their own. This workflow has no `pull_request`
#   trigger; it listens for `workflow_run: workflows: [Tests]` instead, and
#   the plan job's own `if:` only lets a workflow_run event through when the
#   upstream Tests run (a) succeeded and (b) was itself a pull_request run
#   (push/schedule/dispatch Tests runs also fire this event and are ignored
#   here -- push/schedule/dispatch mutation runs keep their OWN unaffected
#   triggers below). This is why: mutation's matrix jobs used to start
#   alongside Tests on every PR and could occupy every account-wide Actions
#   runner before Tests even got a slot, starving the one CI check that gates
#   merges. See "PR context: workflow_run" below for how the PR's number,
#   branch and base sha are recovered from the workflow_run payload, and
#   `.github/workflows/cancel-stale-runs.yml` for what cancels a leftover run
#   of this workflow (or Tests, or mutation-mutmut) when the PR closes before
#   its Tests run, or this run, finishes.
# - push to main: incremental. Each module restores its newest .gremlins_cache
#   and gremlins reuses cached results; only what the cache can't reuse is run.
#   The cache NAMESPACE is an outer fingerprint of EVERY tracked repository input
#   (git ls-files in the checkout) -- everything a module's outcome depends on but
#   gremlins' own cache keys do not hash (conftest.py, shared tests/ helpers,
#   imported production modules, experiment run.py fixtures, the dependency locks,
#   the mutation/workflow config) -- not a hand list that can drift. Over-
#   invalidating is the intent -- a stale hit would publish a wrong mutation
#   outcome, a needless restart only costs one re-run -- so even a docs-only push
#   may restart a module. The namespace is computed BEFORE the cache is restored/
#   saved and any fingerprint failure aborts the key step under set -e, so a broken
#   digest can never restore or write a cache under a wrong key. A push's own run
#   also cancels an older still-running push run on main (see concurrency below),
#   so a rapid string of merges cannot queue behind itself.
# - weekly schedule, and workflow_dispatch by default: full, from scratch
#   (no restore, --fresh clears the cache). Dispatch with fresh=false for an
#   incremental run, and `modules` for a subset. Neither cancels a same-kind
#   run in progress (see concurrency below).
# - Scores never fail a job. A job fails ONLY when the tool does: a nonzero
#   pytest/gremlins exit code, a missing/malformed current-run raw report, an
#   ERROR gremlin result, or a merged module set that is not the one the plan
#   scheduled. Survivors/score are report-only. Every module job uploads
#   results.jsonl + summary.json + the raw gremlins.json; the `report` job
#   merges the module reports into one `mutation-report` artifact, and it does
#   so even when merge exits nonzero on an ERROR/incomplete module: merge's rc is
#   captured, the summary it did write is appended, the artifact is uploaded with
#   always(), and only then does the job fail on that rc.
#   Merge is given the plan's module list (--expected-modules) and is called even
#   when ZERO module artifacts were downloaded, because a matrix job that died
#   before its export/upload leaves a subset that would otherwise publish as a
#   valid full run: the missing/extra/duplicate module set makes merge write an
#   incomplete tool-error artifact (never a clean-looking subset) and exit
#   nonzero, so `mutation-report` can only ever describe the whole planned run.
#
# PR context: workflow_run. GitHub evaluates a `workflow_run` trigger, its
# `if:` conditions and its permissions using the workflow file version ON THE
# DEFAULT BRANCH, never the PR branch's own copy -- a PR cannot edit this file
# to change how (or whether) it runs against itself. Be accurate about what
# that DOES and does NOT buy: the job still runs in the BASE REPOSITORY's
# context, meaning it CAN read this repo's secrets, and the `mutate` job
# checks out the PR's own `head_sha` and then runs that PR's code (pip
# installing its `requirements.txt`, running its `tools/*.py`) inside that
# context -- this is not a sandboxed, secret-free review. `permissions:
# contents: read` below only narrows the auto-issued GITHUB_TOKEN's own
# scope; it does not block a `secrets.FOO` reference (none exist in this
# file today) or the ambient runtime token every job carries for
# actions/cache. Skipping the "Save gremlins cache"/"Save mutmut state" step
# on a PR run (see below) keeps our OWN steps from writing under main's
# cache key, but does not by itself stop PR code from calling the cache API
# directly with that ambient token. The real security boundary is the
# same-repository gate on `workflow_run.pull_requests` (below): only a
# contributor who already has push access to this repository can reach this
# job at all, so this does not open a privilege a same-repo contributor
# didn't already have. A fork PR never reaches here (see below). One
# consequence of using main's copy of the file: after this change merges,
# the gate applies to every qualifying Tests completion from then on,
# including for PRs that were opened before the merge -- not only new ones.
# `github.event.workflow_run.pull_requests` -- the array holding the PR's
# number/branch/base sha -- is populated only when the PR's head repository is
# this same repository; for a fork PR it is empty (a documented GitHub
# limitation, not a bug here), so the plan job's `if:` also requires that
# array to be non-empty and a fork PR's mutation run is skipped outright
# (mutation is report-only and already excluded from required checks, so this
# only means a fork PR gets no mutation coverage -- its Tests run is
# unaffected). The array is read with the `.*` projection + `join(...)` (e.g.
# `join(github.event.workflow_run.pull_requests.*.number, ',')`), never
# `pull_requests[0]` directly: indexing an empty array throws and would fail
# the expression outright, exactly for the fork-PR case this must degrade out
# of cleanly instead. The `$EVENT`/`$BASE_SHA` bash variables the plan and
# mutate steps below already used for their PR-selection and cache-key logic
# (added for #13/#28/#30) are fed from these same workflow_run-aware
# expressions, so every `"$EVENT" = "pull_request"` check in this file keeps
# meaning exactly what it always meant -- "this is a PR run" -- unchanged.
#
# Concurrency group `mutation-gremlins-...`: disjoint from the mutmut
# workflow's `mutation-mutmut-...` group, so a run of one active backend never
# queues behind the other.
name: mutation

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
  schedule:
    - cron: "23 5 * * 0"  # Sundays 05:23 UTC: full run
  workflow_dispatch:
    inputs:
      fresh:
        description: "Full run from scratch (clear the gremlins cache). Untick for incremental."
        type: boolean
        default: true
      modules:
        description: "Comma-separated module subset (empty: every enabled module)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # workflow_run (a PR's Tests run completing) gets a per-branch group with
  # cancel-in-progress true, so a new push to the PR -- which reruns Tests and
  # so re-fires this trigger -- supersedes the last mutation run instead of
  # queuing behind it. Grouped by head_branch, not PR number: the number lives
  # inside the pull_requests array (see "PR context" above), which is unsafe
  # to index here (a top-level `concurrency:` expression error would fail the
  # whole run to start), while head_branch is a plain top-level field that is
  # always present, PR or not. The group ALSO folds in
  # workflow_run.event: Tests fires workflow_run for every trigger it has
  # (push, schedule, dispatch, AND pull_request), not only the pull_request
  # one this workflow's plan job actually acts on (see "PR context" above) --
  # without this, a manually re-run/dispatched Tests run on a PR's branch
  # would land in the SAME group as that PR's real pull_request-triggered
  # mutation run and cancel it, even though the dispatch-flavored workflow_run
  # itself does nothing (the plan job's `if:` skips it), losing that PR's
  # mutation coverage for no benefit. push also cancels an in-progress older
  # push run on main, so a fast string of merges cannot queue up behind
  # itself. schedule and workflow_dispatch keep the exact old group and stay
  # non-cancelling: neither github.event_name is 'workflow_run' nor 'push',
  # so the ternary's false branch -- the unchanged literal ref-based group --
  # is what they get.
  group: mutation-gremlins-${{ github.event_name == 'workflow_run' && format('{0}-{1}', github.event.workflow_run.head_branch, github.event.workflow_run.event) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' || github.event_name == 'push' }}

env:
  # The phase-0 environment lock (requirements.txt header: "python 3.14.4").
  # pytest-gremlins 1.9.0 supports Python 3.14.
  PYTHON_VERSION: "3.14.4"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # gremlins' incremental cache directory, relative to the repo checkout the
  # plugin runs in. Cached only for incremental runs; the CI cache key pins the
  # backend version AND the per-module invalidation fingerprint (see the `key`
  # step), so a backend bump -- or any change to the shared source/test/helper/
  # lock/config inputs -- restarts the module from scratch.
  GREMLINS_CACHE: .gremlins_cache

jobs:
  plan:
    # push/schedule/dispatch: unaffected, always proceed (github.event_name is
    # never 'workflow_run' for them). workflow_run: proceed only when the
    # Tests run it followed succeeded AND was itself a pull_request run AND
    # that run's PR is in this same repository (pull_requests non-empty, read
    # via the `.*`/join projection -- never `pull_requests[0]`, which throws
    # on the empty array a fork PR produces). Any other workflow_run (Tests on
    # push/schedule/dispatch, or a failed/cancelled Tests run) is a no-op: the
    # job -- and everything that needs it -- is skipped, not failed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      join(github.event.workflow_run.pull_requests.*.number, ',') != '')
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.plan.outputs.modules }}
      mode: ${{ steps.plan.outputs.mode }}
      gremlins: ${{ steps.plan.outputs.gremlins }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run: the PR's own head commit (never the default branch,
          # which is what an unpinned checkout would give this event -- see
          # "PR context" above). push/schedule/dispatch: '' means "use the
          # default for this event", byte-identical to the old unpinned
          # checkout.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          # workflow_run (a PR run): full history, so the changed-file diff
          # below can reach the PR's base commit. push/schedule/dispatch keep
          # the default shallow checkout (depth 1) -- byte-identical to
          # before.
          fetch-depth: ${{ github.event_name == 'workflow_run' && '0' || 1 }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: plan
        env:
          # Remapped so every check below ("$EVENT" = "pull_request") keeps
          # meaning "this is a PR run" unchanged: a workflow_run event that
          # reached this step (the job `if:` above already required it to be
          # a successful PR Tests run) reads here as "pull_request", exactly
          # as a direct pull_request-triggered run used to.
          EVENT: ${{ github.event_name == 'workflow_run' && 'pull_request' || github.event_name }}
          FRESH: ${{ inputs.fresh }}
          ONLY: ${{ inputs.modules }}
          # workflow_run: the PR's base sha lives on the linked pull request,
          # read via the `.*`/join projection (a single-element array joins to
          # exactly that one sha; never `pull_requests[0]`, unsafe on the
          # empty array a fork PR would produce).
          BASE_SHA: ${{ github.event_name == 'workflow_run' && join(github.event.workflow_run.pull_requests.*.base.sha, ',') || github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ] || [ "$EVENT" = "pull_request" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$FRESH" = "false" ]; }; then
            mode=incremental
          else
            mode=full
          fi
          gremlins=$(sed -n 's/^pytest-gremlins==\([^ ]*\).*/\1/p' requirements-dev.txt)
          test -n "$gremlins"
          # pull_request only: narrow the matrix to the modules the PR's diff
          # can actually affect -- each changed path selects every enabled
          # module that owns it OR transitively depends on it (a static ast
          # import-graph closure over every tracked .py file, ALLOWLIST-
          # classified: a plain import, the one literal
          # importlib.import_module("x.y") call, or a conftest.py's plain
          # pytest_plugins list resolve to specific edges (including
          # conftest.py closure roots); anything else the file references at
          # all -- sys.path, subprocess, a loader construct, __import__ in
          # any form, or a short list of other dangerous names/modules --
          # fails the WHOLE FILE safe, depending on every other tracked file;
          # the shared changed_modules selection rule), or nothing if it is on
          # the small docs-only inert allowlist (tools/mutation_pilot.toml's
          # [pr_selection] inert), or EVERY enabled module if it is neither
          # (an unrecognized path is never assumed safe to skip) or if the
          # import graph itself cannot be built. -z pairs with a
          # NUL-splitting reader so a non-ASCII changed path is not quoted.
          # push/schedule/dispatch never set CHANGED_ARGS, so the matrix
          # command below stays byte-identical to before (an empty unquoted
          # expansion contributes zero argv words).
          # This static analysis is conservative for the constructs named
          # above, NOT sound in general -- see issue #42 for constructs it
          # misses entirely (string-target monkeypatch/mock.patch,
          # importorskip, getattr-based imports, __import__ via
          # globals/builtins, asyncio subprocess-exec, __path__/meta_path
          # edits, pytest_plugins outside a conftest.py, from-pkg-import-star
          # re-exports). Today tests/conftest.py itself always classifies
          # DYNAMIC (its own sys.path.insert), so every test file's closure
          # already includes it and every non-inert PR change already
          # selects every enabled module regardless of those holes;
          # tests/test_mutation_ci.py has a synthetic-tree test that fails
          # loudly, naming issue #42, if that ever stops being true.
          CHANGED_ARGS=""
          if [ "$EVENT" = "pull_request" ]; then
            CHANGED_FILE="$RUNNER_TEMP/pr-changed-files.txt"
            git diff -z --no-renames --name-only "$BASE_SHA"...HEAD > "$CHANGED_FILE"
            CHANGED_ARGS="--changed-files $CHANGED_FILE"
          fi
          # Assign in its own command, never inside the echo: the exit status of
          # `echo "modules=$(...)"` is echo's, so a failing matrix command would
          # write an empty module list and the step would still pass. Under
          # `set -e` a command substitution in a plain assignment does abort, and
          # `gremlin_pilot.py matrix --only ,` now refuses instead of emitting
          # the empty matrix that would silently skip the whole matrix job.
          modules=$(python3 tools/gremlin_pilot.py matrix --only "$ONLY" $CHANGED_ARGS)
          {
            echo "modules=$modules"
            echo "mode=$mode"
            echo "gremlins=$gremlins"
          } >> "$GITHUB_OUTPUT"

  mutate:
    needs: plan
    # plan.result == 'success' first: plan's own `if:` above can SKIP it
    # (fork PR, unsuccessful/non-PR workflow_run), and a skipped job's
    # outputs are unset, not '[]' -- checking outputs.modules alone would
    # then read '' != '[]' as true and start the matrix with no plan behind
    # it.
    if: needs.plan.result == 'success' && needs.plan.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.modules) }}
    env:
      MODULE: ${{ matrix.module }}
      MODE: ${{ needs.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the push's base commit, for the report adapter's change window
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      - id: py
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - id: key
        env:
          EVENT: ${{ github.event_name == 'workflow_run' && 'pull_request' || github.event_name }}
          # workflow_run: the PR's base sha lives on the linked pull request,
          # read via the `.*`/join projection (a single-element array joins to
          # exactly that one sha; never `pull_requests[0]`, which throws on
          # the empty array a fork PR would produce -- unreachable here since
          # the plan job's `if:` already required a non-empty array, but kept
          # safe on its own terms rather than relying on that).
          BASE_SHA: ${{ github.event_name == 'workflow_run' && join(github.event.workflow_run.pull_requests.*.base.sha, ',') || github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Assign the fingerprint and config-hash, never interpolate either
          # inside the echo: the exit status of `echo "...=$(...)"` is echo's,
          # so a failing digest would write a truncated prefix and the step
          # would still pass.
          #
          # pull_request only: the fingerprint hashes every tracked file in
          # the CURRENT checkout (see cache_fingerprint), and a PR always
          # differs from main's tree by at least one tracked file -- that's
          # what makes it a PR. Hashing the PR's own checkout therefore can
          # never reproduce the prefix main's push last saved a cache under,
          # so the restore below would miss on every single PR run. Cache
          # SAVES are already skipped for pull_request (see "Save gremlins
          # cache" below), so a PR run only ever needs cache LOOKUP -- computed
          # from a detached checkout of the PR's base commit, matching the
          # tree main's own push last ran (and saved) against. fetch-depth: 0
          # above makes the base commit's objects available locally.
          #
          # config-hash is DIFFERENT: it must always run against the CURRENT
          # checkout (the PR's own tree on pull_request, the pushed tree on
          # push), never the base-commit worktree. If a PR edits this
          # module's own mutation config, its key must differ from main's so
          # it can never restore verdicts main cached under the old config;
          # if the PR does not touch that config, the PR's hash and main's
          # hash are computed from identical config text either way, so
          # restores still work. Running it from the base worktree instead
          # would hide the PR's own config edits from the key.
          if [ "$EVENT" = "pull_request" ]; then
            git worktree add --detach --quiet /tmp/gremlin-base-fp "$BASE_SHA"
            fp=$(python3 tools/gremlin_pilot.py fingerprint "$MODULE" --cwd /tmp/gremlin-base-fp)
            git worktree remove --force /tmp/gremlin-base-fp
          else
            fp=$(python3 tools/gremlin_pilot.py fingerprint "$MODULE")
          fi
          ch=$(python3 tools/mutation_pilot.py config-hash "$MODULE")
          echo "prefix=mutation-gremlins${{ needs.plan.outputs.gremlins }}-py${{ steps.py.outputs.python-version }}-${ch}-${{ matrix.module }}-${fp}-" >> "$GITHUB_OUTPUT"
      # Only the gremlins cache is restored, and only for incremental runs: a
      # full run starts fresh (--fresh clears .gremlins_cache and the workflow
      # skips the restore). The backend version is pinned in the key, so a
       # pytest-gremlins bump restarts every module, and ${fp} is the outer
       # invalidation fingerprint: gremlins' own cache keys only see a mutated
       # source file's hash and the hashes of the test files it directly selected,
       # so every OTHER input -- conftest.py, the shared tests/ helpers, the
       # production modules and experiment run.py fixtures those imports pull in,
       # the dependency locks and the mutation config -- is folded in here by
       # hashing ALL tracked repository inputs (git ls-files), not a hand list that
       # could drift. Over-invalidation is the point (a helper-only or even
       # docs-only push starts a new namespace; a stale hit would publish a wrong
       # mutation outcome), while an unchanged tree keeps the same namespace and
       # restores the newest entry. matrix.module keeps the per-module separation,
       # so one module's cache never answers for another's.
      - name: Restore gremlins cache
        if: needs.plan.outputs.mode == 'incremental'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.GREMLINS_CACHE }}
          key: ${{ steps.key.outputs.prefix }}${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.key.outputs.prefix }}
      - name: Run pytest-gremlins
        id: run
        # 60 min on a PR's gated workflow_run: incremental PR checks must stay
        # bounded and never queue behind (or emulate) main's full 330-min
        # budget. main's push/schedule/dispatch runs are unaffected -- only
        # the event differs.
        timeout-minutes: ${{ github.event_name == 'workflow_run' && 60 || 330 }}
        run: |
          set -euo pipefail
          date +%s > "$RUNNER_TEMP/gremlin-start"
          # --fresh only for a full run: it clears .gremlins_cache. Incremental
          # keeps the cache this job restored above. A plain string (not an
          # array) so it never trips `set -u` when empty.
          FRESH=""
          if [ "$MODE" = "full" ]; then FRESH="--fresh"; fi
          set +e
          python -u tools/gremlin_pilot.py run "$MODULE" $FRESH
          echo "$?" > "$RUNNER_TEMP/gremlin-rc"
          set -e
      # Uploaded even if the run failed or the report step below errors, so the
      # raw result of the current run is always retrievable for triage. The
      # gremlin_pilot run deleted any older raw report before starting, so this
      # file -- if present -- is from THIS run.
      - name: Upload raw gremlins report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gremlin-raw-${{ matrix.module }}
          path: coverage/gremlins/gremlins.json
          retention-days: 90
          if-no-files-found: warn
      - name: Export report
        if: always() && steps.key.outcome == 'success'
        env:
          # PRs use the PR base SHA as the change window base (github.event.before
          # only exists on push).
          BEFORE: ${{ github.event_name == 'push' && github.event.before || (github.event_name == 'workflow_run' && join(github.event.workflow_run.pull_requests.*.base.sha, ',') || '') }}
        run: |
          set -euo pipefail
          rc=$(cat "$RUNNER_TEMP/gremlin-rc" 2>/dev/null || echo -1)  # -1: killed by the step timeout
          start=$(cat "$RUNNER_TEMP/gremlin-start" 2>/dev/null || date +%s)
          # set -e: gremlin_results.py export is the gate for a missing/malformed
          # current-run raw report and for ERROR gremlin results -- a nonzero
          # exit here must fail the job. Survivors/score never exit nonzero.
          python tools/gremlin_results.py export "$MODULE" --out "report/$MODULE" --mode "$MODE" \
            ${BEFORE:+--changed-base "$BEFORE"} --run-exit-code "$rc" --elapsed "$(( $(date +%s) - start ))"
          cat "report/$MODULE/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outcome == 'success'
        with:
          name: mutation-module-${{ matrix.module }}
          path: report/${{ matrix.module }}/
          retention-days: 90
          if-no-files-found: warn
      # Saved even after a failure, so the next incremental run resumes the cache.
      # Never on a PR's gated workflow_run: a PR run must not overwrite main's
      # incremental cache entries (the key carries no PR number), so saving is
      # skipped entirely for PRs and main's cache stays untouched.
      - name: Save gremlins cache
        if: always() && steps.key.outcome == 'success' && github.event_name != 'workflow_run'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.GREMLINS_CACHE }}
          key: ${{ steps.key.outputs.prefix }}${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Fail only on a tool error, never on scores
        if: always() && steps.key.outcome == 'success'
        run: |
          rc=$(cat "$RUNNER_TEMP/gremlin-rc" 2>/dev/null || echo -1)
          if [ "$rc" != 0 ]; then echo "::error::pytest-gremlins run exited $rc"; exit 1; fi

  report:
    needs: [plan, mutate]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.modules != '[]'
    runs-on: ubuntu-latest
    env:
      # The plan's module list, passed to merge as a variable (never interpolated
      # into the script text), so a module set that is not exactly the one the
      # plan scheduled cannot be published as a valid full run.
      EXPECTED_MODULES: ${{ needs.plan.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-module-*
          path: modules
      - name: Merge module reports
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(modules/mutation-module-*)
          if [ ${#dirs[@]} -eq 0 ]; then
            # Not "nothing to do, pass": the plan expected modules and none of
            # them uploaded. merge is called with no input directories, writes an
            # incomplete diagnostic artifact against EXPECTED_MODULES, and exits
            # nonzero -- the job fails in the gate step below.
            echo "::warning::no mutation-module-* artifacts were downloaded; merging against the expected module list anyway"
          fi
          # Capture merge's rc, do NOT let `set -e` skip the rest: merge writes a
          # diagnostic summary and then exits nonzero when a module came back
          # ERROR/incomplete or the module set is not the expected one. The
          # consolidated artifact and that summary are the whole point of the
          # report job, so they must survive the nonzero rc; the job fails on it
          # only in the gate step below.
          set +e
          python tools/gremlin_results.py merge --out merged \
            --expected-modules "$EXPECTED_MODULES" "${dirs[@]}"
          echo "$?" > "$RUNNER_TEMP/gremlin-merge-rc"
          set -e
          if [ -f merged/summary.md ]; then
            cat merged/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$(cat "$RUNNER_TEMP/gremlin-merge-rc")
            # No summary means nothing was consolidated: that is a failure even
            # when merge's own exit code said otherwise.
            if [ "$rc" = 0 ]; then
              echo "::error::merge exited 0 but wrote no merged/summary.md"
              echo 1 > "$RUNNER_TEMP/gremlin-merge-rc"
            fi
          fi
      # always(): the partial/failed merge output is exactly what triage needs,
      # so the artifact goes up whether or not the merge succeeded.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: merged/
          retention-days: 90
          if-no-files-found: warn
      - name: Fail only on a merge error, never on scores
        if: always()
        run: |
          rc=$(cat "$RUNNER_TEMP/gremlin-merge-rc" 2>/dev/null || echo -1)
          if [ "$rc" != 0 ]; then echo "::error::report merge exited $rc"; exit 1; fi
