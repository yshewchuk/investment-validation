# When a PR closes (merged or not), cancel any run of Tests, mutation or
# mutation-mutmut still in_progress/queued for it, so a closed PR does not
# keep occupying account-wide Actions runners (the same starvation concern
# mutation.yml's own header comment describes for open PRs). Tests and the two
# mutation workflows are all covered because Tests runs directly on
# `pull_request`, while mutation.yml/mutation-mutmut.yml now run via
# `workflow_run` gated on Tests succeeding (see mutation.yml's "PR context:
# workflow_run" comment) and so can still be mid-run when the PR closes.
#
# Same-repo PRs only. `permissions: actions: write` above is what lets the
# cancel calls below succeed at all; for a FORK pull_request, GitHub forces
# the run's GITHUB_TOKEN to read-only regardless of what this file requests,
# so the calls below would just fail closed (403) with no effect. The `if:`
# guard on the job skips that case outright instead of leaving a noisy failed
# run behind for something that could never have worked, which is also the
# safe behavior for a fork PR: nothing here ever runs with write access to a
# fork's own code or a secret.
name: cancel-stale-runs

on:
  pull_request:
    types: [closed]

permissions:
  actions: write

concurrency:
  group: cancel-stale-runs-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cancel:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Cancel in-progress/queued Tests/mutation/mutation-mutmut runs for this PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          for wf in Tests mutation mutation-mutmut; do
            for status in in_progress queued; do
              # List across the whole repo's runs (not one workflow file), then
              # keep only this backend's by its `name:` field -- avoids needing
              # each workflow's own numeric/file id.
              ids=$(gh api --paginate "repos/$REPO/actions/runs?status=$status" \
                -q ".workflow_runs[] | select(.name == \"$wf\") | .id")
              for id in $ids; do
                # Two ways a run can belong to this PR: Tests is triggered
                # directly by `pull_request` and its own head_branch is the
                # PR's branch; mutation/mutation-mutmut are triggered by
                # `workflow_run` instead, whose head_branch/head_sha describe
                # the Tests run they followed, but the run resource itself
                # still carries the same linked pull_requests[].number (see
                # mutation.yml's "PR context: workflow_run" comment on why
                # that array can be empty for a fork PR -- `// []` below
                # keeps that case a plain no-match instead of a jq error).
                match=$(gh api "repos/$REPO/actions/runs/$id" \
                  -q "select(.head_branch == \"$PR_BRANCH\" or ((.pull_requests // []) | any(.number == $PR_NUMBER))) | .id")
                if [ -n "$match" ]; then
                  echo "cancelling $wf run $id (status=$status, branch=$PR_BRANCH, pr=$PR_NUMBER)"
                  gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null || true
                fi
              done
            done
          done
