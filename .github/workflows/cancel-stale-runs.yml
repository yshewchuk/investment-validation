# When a PR closes (merged or not), cancel any run of Tests, mutation or
# mutation-mutmut still in_progress/queued for it, so a closed PR does not
# keep occupying account-wide Actions runners (the same starvation concern
# mutation.yml's own header comment describes for open PRs). Tests and the two
# mutation workflows are all covered because Tests runs directly on
# `pull_request`, while mutation.yml/mutation-mutmut.yml now run via
# `workflow_run` gated on Tests succeeding (see mutation.yml's "PR context:
# workflow_run" comment) and so can still be mid-run when the PR closes.
#
# Same-repo PRs only. The workflow-level `permissions: {}` below denies
# everything by default; the `cancel` job's own `actions: write` grant
# (scoped there, not at workflow level, so a future job added to this file
# does not inherit it for free) is what lets the cancel calls below succeed
# at all; for a FORK pull_request, GitHub forces the run's GITHUB_TOKEN to
# read-only regardless of what this file requests, so the calls below would
# just fail closed (403) with no effect. The `if:` guard on the job skips
# that case outright instead of leaving a noisy failed run behind for
# something that could never have worked, which is also the safe behavior
# for a fork PR: nothing here ever runs with write access to a fork's own
# code or a secret.
name: cancel-stale-runs

on:
  pull_request:
    types: [closed]

# Explicit deny-all baseline (zizmor: excessive-permissions) instead of
# relying on the repo's default GITHUB_TOKEN permissions, which can be
# broader than this workflow needs and which a future job with no
# `permissions:` of its own would otherwise inherit. The `cancel` job below
# grants itself exactly what it needs on top of this.
permissions: {}

concurrency:
  group: cancel-stale-runs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cancel:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Required to list and cancel repository Actions runs through gh api;
    # scoped to this one job so it is never inherited by a future job added
    # to this workflow.
    permissions:
      actions: write
    steps:
      - name: Cancel in-progress/queued Tests/mutation/mutation-mutmut runs for this PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          for wf in Tests mutation mutation-mutmut; do
            for status in in_progress queued; do
              # The runs endpoint's own `branch=` filter narrows the list
              # server-side (mutation/mutation-mutmut runs started by
              # workflow_run carry the originating Tests run's head_branch,
              # i.e. this PR's branch), so this never needs to page through
              # every in-progress/queued run repo-wide. PR_BRANCH is passed
              # as a `-f` query parameter, not interpolated into a filter
              # string, so it can never change what is requested regardless
              # of what characters a branch name contains. $wf is one of the
              # three literal names above, never attacker input, so binding
              # it via --arg here is a hygiene choice, not a required one.
              ids=$(gh api --paginate -X GET "repos/$REPO/actions/runs" \
                  -f status="$status" -f branch="$PR_BRANCH" \
                | jq -r --arg wf "$wf" '.workflow_runs[] | select(.name == $wf) | .id')
              for id in $ids; do
                # Confirm the match instead of trusting the branch filter
                # alone: `branch=` only identifies a branch string, not this
                # PR -- a fork's branch can share a name with a same-repo
                # branch (head_branch carries no owner/fork identity), so an
                # OR'd head_branch fallback could cancel a same-named
                # sibling's run. The run's own linked pull_requests[].number
                # is the only thing that actually proves it belongs to this
                # PR, checked as jq DATA via --argjson, never
                # string-interpolated into the filter text (a branch name
                # may legally contain a `"`, which would otherwise let a
                # crafted branch name widen the filter). This job only ever
                # runs for a same-repo PR (see the `if:` guard below), so
                # pull_requests[] is populated for every run that is
                # actually this PR's -- `// []` keeps a run with no linked
                # PR at all (never this PR's) a plain no-match instead of a
                # jq error, rather than a reason to fall back to branch name.
                match=$(gh api "repos/$REPO/actions/runs/$id" \
                  | jq -r --argjson n "$PR_NUMBER" \
                    'select((.pull_requests // []) | any(.number == $n)) | .id')
                if [ -n "$match" ]; then
                  echo "cancelling $wf run $id (status=$status, branch=$PR_BRANCH, pr=$PR_NUMBER)"
                  if ! gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null; then
                    echo "::warning::failed to cancel $wf run $id"
                  fi
                fi
              done
            done
          done
