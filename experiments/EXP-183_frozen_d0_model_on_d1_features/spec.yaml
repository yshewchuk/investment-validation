  model_training: "D0 features and D0 returns, expanding annual folds"
  model_scoring: "paired D-1 decision-date features"
  threshold: "unchanged gate_midfill_str_thru_forecast_analog threshold"
  execution: "D0 entry and exit fills from paired EXP-179 rows"
data_snapshot: "EXP-179 plus EXP-182 decision-time feature caches"
