id: EXP-183
title: "Frozen D0 gate model scored on D-1 features"
hypothesis: >
  A walk-forward STR-THRU gate trained only on each fold's prior-year D0
  feature rows and D0 realized returns, with the deployed D0 threshold held
  fixed, retains selected-book performance when it scores paired D-1
  decision-date feature rows and trades the existing D0 entry/exit fills.
  This tests the current operational workflow without D-1 retraining.
