id: EXP-105
title: "STR-THRU validation: registered mid-fill gate on the engine trade set"
hypothesis: "Confirmatory re-validation on the rebuilt pipeline, not discovery. The registered champion gate gate_midfill_str_thru at its stored threshold delivers, under independent walk-forward on all 17,666 engine-replayed STR-THRU events 2018-2026, an OOS mean return per trade materially above the ungated base - of the order the registry training evaluation records (base +2.92%, gated +7.34%, lift +4.42pp). Falsified if the independent OOS lift is not materially positive, or if the gate lifts the mean without improving breakeven alpha (ungated baseline 0.448)."
type: confirmatory
strategy: STR-THRU
price_source: ORATS chains (bid/ask, validated +/-2-3%) + engine.replay pricing
primary_spec:
  gate: gate_midfill_str_thru
  gate_kind: registered champion, stored threshold (0.06645), model class refit per walk-forward fold on years < Y
  gate_features: registry feature list (43), rows without complete features unscoreable and not selected
  universe: all engine-replayed STR-THRU events 2018-2026, unselected (n=17,666)
  structure: STR-THRU e+0 x+1 (last pre-print close in, first post-print close out)
  fills: full alpha grid {0.0, 0.25, 0.5, 0.75, 1.0}; mid headline
  equity: cashflow mode, max_deployed_fraction 1.0
  mc: block bootstrap block=20, paths=1000, seed=0, draw_order=shared
grid: {}
