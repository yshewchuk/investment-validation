promotion_target: null
required_outputs:
  - OOS mean / Sharpe / win rate / profit factor with the unselected universe beside the gated set
  - breakeven alpha vs the 0.448 ungated baseline (margin of safety on the mid-fill assumption)
  - gate-lift reconciliation vs the registry training-eval lift (+4.42pp, OOS 2020-2026)
  - calibration block from the in-fold isotonic predict_proba
  - stress battery (2018Q4, 2020-02..04, 2022, 10 worst earnings weeks, IV-regime split)
  - deployment (peak deployed / equity, worst cash, constrained entries)
