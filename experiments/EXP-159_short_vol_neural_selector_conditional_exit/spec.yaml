id: EXP-159
title: "Short-vol neural selector corrected exits with arithmetic-gate benchmark"
strategy: DYN-SV
type: exploratory_model_comparison
price_source: >
  Frozen real-quote candidate grid from EXP-134. Each candidate uses the
  validated conditional-exit rule: close after the print only when the quoted
  curve passes no-arbitrage checks and has nonnegative close proceeds;
  otherwise settle at the stored expiry payoff. All arms use the same stored
  five fill alphas and no vendor calls.
hypothesis: >
  The prior EXP-158 comparison was invalid because it consumed raw exit marks
  that can be negative for a defined-risk debit structure. On validated
  conditional-exit candidates, the PnL-plus-analogs MLP and its four feature
  categories can be compared with the live arithmetic short-vol gate. The
  primary full-category MLP must beat the matched PnL-plus-analogs MLP; the
  arithmetic gate is a required operational benchmark, not an afterthought.

primary_spec:
  candidate_structure: "EXP-134 conditional-exit best_all candidate, held fixed per event"
  decision: "Entry close; current dynamic short-vol arithmetic rule or annual neural rule"
  target: "Validated conditional-exit midpoint return"
  architecture: "StandardScaler plus 3-seed MLPRegressor(64,32), early stopping"
  neural_train_rule: "Expanding annual fit on earlier years; annual top-20-percent cutoff from training predictions only."
  arithmetic_rule: >
    Current DYN-SV rule exactly: expected PnL at or above the top-20-percent
    trailing six-month monthly bar, at least 100 prior candidates, relative
    spread at or below 25 percent, and market cap at or above 10 billion USD.
  first_test_year: 2020
  top_fraction: 0.20
  primary: nn_all_categories_top20
  matched_neural_control: nn_pnl_analogs_top20
  operational_benchmark: arithmetic_pnl_gate

base_features:
  pnl: [exp_pnl_sim, exp_pnl_sim_select]
  analogs: [analog_mean, analog_win_rate, analog_p10, analog_p90, analog_n]
  analog_construction: >
    Nearest historical candidate outcomes, restricted to exits before the
    event entry. Distance uses expected PnL, width, leg count, anchor and
    relative spread from the historical pool only.

feature_categories:
  geometry_forecast:
    [pred_abs_move, pred_abs_move_sd, width_over_forecast, half_width_pct_spot,
     anchor_over_spot, n_legs, n_admissible, dte_entry]
  event_history:
    [mean_prior_abs_move, ema12r_abs, signed_streak, mean_prior_or_implied,
     mcap_log, or_implied, or_rvol30]
  market_state:
    [spy_ret21, spy_ret63, spy_ret252, spy_dd252, spy_vol5, spy_vol20,
     spy_vol60, spy_vol252, spy_vol20_rel252]
  execution_quality:
    [rel_spread, entry_cost_pct, quote_repaired, wide_market]

arms:
  - arithmetic_pnl_gate
  - nn_pnl_analogs_top20
  - nn_plus_geometry_top20
  - nn_plus_history_top20
  - nn_plus_market_top20
  - nn_plus_execution_top20
  - nn_all_categories_top20

evaluation:
  universe: >-
    EXP-134 best_all candidates with a nonmissing conditional exit value and
    feature-complete arm inputs. Every selected event is evaluated over the
    full stored alpha grid.
  required_metrics:
    - "real-price midpoint mean, CAGR, trade Sharpe and positive years for every arm"
    - "five-point fill sensitivity and breakeven alpha"
    - "OOS rank Spearman and decile spread"
    - "arithmetic gate versus PnL-plus-analogs neural control head to head"
    - "earnings-week bootstrap for full neural versus matched neural control"
  primary_success:
    - "primary midpoint mean and trade Sharpe exceed matched neural control"
    - "primary positive-year share is no lower than matched neural control"
    - "primary breakeven alpha is no worse than matched neural control"
    - "primary-minus-control 90 percent earnings-week interval excludes zero above"
  multiplicity: >-
    Seven arms are exploratory. The full-category neural arm is the sole
    primary. The arithmetic result is reported for operational comparison; no
    result changes a live rule or registry without confirmation.

data:
  candidates: "EXP-134 results/candidates.parquet, arm=best_all, conditional exits"
  panel: "Tier-3 prior-event and market-state feature panel"
  data_snapshot: "6f58c834777b6dae6878e317f6eb3a58bc81fca14f9a5647228ebb5c2be1f9e7"
  quota_calls: 0
walk_forward:
  unit: year
  min_train_years: 0
  note: "Neural fits are performed upstream per annual fold; evaluate consumes precomputed OOS decisions."
equity_mode: cashflow
max_deployed_fraction: 1.0
mc_draw_order: shared
has_short_leg: true
promotion_target: null
preregistered_at: "2026-09-08T22:28:00+00:00"
