id: EXP-181
title: "D-1 gated execution parity"
hypothesis: >
  The deployed STR-THRU forecast-plus-analog gate, rebuilt at each D-1
  decision close with only decision-time features and evaluated on unchanged
  D0 entry and exit fills, preserves its selected-book midpoint performance
  versus the same gate evaluated at D0. The DYN-SV short-vol rule and chooser
  are a separately reported production layer in this same execution study.
strategy: "STR-THRU"
price_source: >
  Tier-2 normalized option chains and engine.replay D0 fills from EXP-179;
  D-1 identifies contracts and quotes the decision premium only. No model
  marks or external calls. quota_calls: 0.
primary_spec:
  arm: "STR-THRU D-1 decision-date gate"
  gate: "gate_midfill_str_thru_forecast_analog stored threshold"
  target: "realized D0 entry-to-exit return"
  comparison: "matched D0/D-1 events from EXP-179"
data_snapshot: "EXP-179 normalized D-1 chain replay"
walk_forward:
  unit: year
  min_train_years: 2
  feature_as_of: "decision_date for D-1, entry_date for D0"
equity_mode: cashflow
has_short_leg: false
promotion_target: null
