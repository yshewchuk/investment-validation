walk_forward:
  unit: year
  min_train_years: 2
equity_mode: cashflow
max_deployed_fraction: 1.0
mc_draw_order: shared
has_short_leg: false
promotion_target: null
promotion_path: >
  This experiment does not promote a model. Its outcome feeds the guard
  decision per decision_rule above: a dedicated small-name gate registration
  (outcome 1), a champion refresh via engine.models.training.train_all --role
  gate (outcome 2), or the guard standing (outcome 3).
