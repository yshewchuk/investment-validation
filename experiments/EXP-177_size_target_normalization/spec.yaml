id: EXP-177
title: "Target normalization for the size model"
strategy: "STR-THRU"
type: exploratory_model_comparison
price_source: "Cached ORATS historical bid and ask chains normalized through engine.replay; realized moves are from the causal Tier-3 panel."
hypothesis: >
  The MLP input path already standardizes features, but the positive absolute
  move target is skewed and has a long right tail. Fold-fitted target
  standardization, robust median/IQR scaling, or a log1p target may improve
  optimization and tail-aware generalization without changing the live feature
  set or the inverse-transformed units of the prediction.
primary_spec:
  baseline: size_v1_4_raw_target
  challenger: size_v1_4_log1p_target
  target: "abs_move, absolute earnings move in percent of spot"
  architecture: "unchanged equal-weight OLS plus MLP(64,32) blend; only target transform varies"
  selection_book: "STR-THRU forecast-edge top-20 control, economic companion only"
  modeled_fill_alpha: 0.5
arms:
  - name: raw_target
    transform: identity
  - name: standardized_target
    transform: "(y - train_mean) / train_std"
  - name: robust_target
    transform: "(y - train_median) / train_IQR"
  - name: log1p_target
    transform: "log1p(y)"
definitions:
  raw_target: "Current model fit directly to abs_move."
  standardized_target: "Each fold fits mean and standard deviation on training abs_move, then inverse-transforms OOS predictions."
  robust_target: "Each fold fits median and IQR on training abs_move, then inverse-transforms OOS predictions."
  log1p_target: "Each fold fits log1p(abs_move), then applies expm1 and clips predictions at zero."
causal_anchor: "Every target transform is estimated only from rows strictly before the OOS year; no full-sample target moments are used."
data:
  panel: data/features/panel.parquet
  trades: Tier-2 engine.replay STR-THRU trades
  quota_calls: 0
walk_forward:
  unit: year
  min_train_years: 0
  accuracy_window: "Expanding annual walk-forward OOS 2013-2026"
  same_rows: "All target-transform arms use identical complete incumbent-feature rows."
evaluation:
  primary_metrics:
    - overall OOS MAE
    - overall OOS RMSE and Pearson r
    - per-year MAE differences
    - top-minus-bottom forecast-decile realized-move spread
  robustness:
    - five fixed MLP seeds
    - paired annual MAE Wilcoxon for the primary log1p arm
    - inverse-transform unit and coverage checks
primary_success:
  - log1p arm improves MAE in at least 8 of 14 annual folds
  - log1p arm median MAE delta is below zero across five seeds
  - log1p paired Wilcoxon p-value is below 0.10
  - no secondary transform is promoted post hoc; promotion requires a new confirmatory registration
falsification: >
  Reject target normalization if the primary log1p arm fails its consistency
  criteria, if improvements depend on changed rows, or if inverse-transformed
  predictions materially damage RMSE or ranking spread.
promotion_target: null
preregistered_at: "2026-09-10T00:00:00+00:00"
