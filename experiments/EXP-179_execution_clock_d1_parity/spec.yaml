id: EXP-179
title: "Execution-clock parity: D0 versus D-1 variants"
type: paired_execution_validation
strategy: "ALL_EXCEPT_STR-RUNUP"
price_source: "Tier-2 ORATS historical option-chain bid/ask, priced by engine.replay; no new API calls"
hypothesis: "For every currently defined strategy except STR-RUNUP, deciding and naming the trade at D-1, then entering the named contracts at the unchanged D0 close and exiting at the unchanged close, has approximately equivalent realized base-exposure performance to the D0 variant on the same chain-covered events. Any material difference is execution-clock evidence, not a gate result."
primary_spec:
  strategies: ["CAL-P", "STR-THRU", "CND-P", "TWIN-P", "TWIN-P5", "CND-PS", "BFLY-P", "BFLY-P5", "RAMP7", "CTR5"]
  excluded_strategy: "STR-RUNUP, because its existing T-14 entry already provides actionable lead time"
  arms: ["D0", "D-1"]
  D0: "Decide, name, and enter at the original entry close"
  D-1: "Decide and name at the prior trading close, hold that named contract, enter at the original entry close"
  entry_exit: "Unchanged across arms"
  comparison_population: "Intersection of event IDs that price at every alpha in both arms, separately for each strategy"
  fills: "Full alpha grid 0.00, 0.25, 0.50, 0.75, 1.00; mid-fill headline"
  gate: "None in either arm. This is an exposure and executable-contract parity test, not a gate comparison."
  calendar: "Known BMO and AMC session calendar from engine.replay"
grid: {}
evaluation:
  required_per_arm:
