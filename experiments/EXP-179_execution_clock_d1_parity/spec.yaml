    - "Paired event count and paired D-1 minus D0 mid-return summary"
    - "D-1 quoted-versus-D0-filled premium drift summary"
  parity_reading: "Compare matched-event mid return, win rate, alpha sweep, by-year means, and D-1 minus D0 paired return distribution. This experiment does not promote a strategy or a model."
  no_model_substitution: "No D0 gate or chooser may be applied to a D-1 row. Separate D-1 gate and chooser experiments follow only after this execution result is reviewed."
