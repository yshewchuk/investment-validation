id: EXP-175
title: "Volatility-scaled stock dislocation features"
strategy: "STR-THRU"
type: exploratory_model_comparison
price_source: "Cached ORATS historical bid and ask chains normalized through engine.replay; realized moves are from the causal Tier-3 panel."
hypothesis: >
  Recent stock dislocations may identify an unusually active name, but raw
  returns mix movement with the prevailing volatility regime. Absolute ret5,
  ret10, and ret20, plus each divided by causal ORATS rVol30, test whether a
  volatility-normalized dislocation improves the direct absolute-move model.
primary_spec:
  baseline: size_v1_4
  challenger: size_v1_4_plus_abs_ret10_over_rvol30
  target: "abs_move, absolute earnings move in percent of spot"
  architecture: "unchanged equal-weight OLS plus MLP(64,32) blend"
  primary_added_feature: abs_ret10_over_rvol30
  selection_book: "STR-THRU forecast-edge top-20 control, economic companion only"
  modeled_fill_alpha: 0.5
arms:
  - name: abs_ret5
    feature: abs_ret5
  - name: abs_ret10
    feature: abs_ret10
  - name: abs_ret20
    feature: abs_ret20
  - name: abs_ret5_over_rvol30
    feature: abs_ret5_over_rvol30
  - name: abs_ret10_over_rvol30
    feature: abs_ret10_over_rvol30
  - name: abs_ret20_over_rvol30
    feature: abs_ret20_over_rvol30
definitions:
  abs_ret5: "Absolute prior 5-session stock return from the causal panel."
  abs_ret10: "Absolute prior 10-session stock return from the causal panel."
  abs_ret20: "Absolute prior 20-session stock return from the causal panel."
  scaled_features: "Absolute return divided by positive pre-event ORATS rVol30; rows without a valid rVol30 remain unscored for the scaled arm."
causal_anchor: "All returns and rVol30 values are known before the earnings event; no event-day information is used."
data:
  panel: data/features/panel.parquet
  trades: Tier-2 engine.replay STR-THRU trades
  quota_calls: 0
walk_forward:
  unit: year
  min_train_years: 0
  accuracy_window: "Expanding annual walk-forward OOS 2013-2026"
  same_rows: "All arms and baseline use the identical complete-case rows on the union of all six added features and incumbent features."
evaluation:
  primary_metrics:
    - overall OOS MAE
    - overall OOS RMSE and Pearson r
    - per-year MAE differences
    - top-minus-bottom forecast-decile realized-move spread
  robustness:
    - five fixed MLP seeds
    - paired annual MAE Wilcoxon for the primary arm
    - no coverage loss from the complete-case rule
primary_success:
  - primary arm improves MAE in at least 8 of 14 annual folds
  - primary arm median MAE delta is below zero across five seeds
  - primary paired Wilcoxon p-value is below 0.10
  - no secondary arm is promoted post hoc; promotion requires a new confirmatory registration
falsification: >
  Reject the volatility-scaled dislocation block if the primary arm fails its
  consistency criteria, if any gain depends on changed rows, or if raw and
  scaled variants disagree without a pre-registered reason to prefer one.
promotion_target: null
preregistered_at: "2026-09-09T00:00:00+00:00"
