id: EXP-107
title: "STR-RUNUP validation: registered mid-fill gate and the three-number reconciliation"
hypothesis: "Confirmatory re-validation on the rebuilt pipeline, not discovery. The registered champion gate gate_midfill_str_runup at its stored threshold delivers positive OOS mean return on all 5,311 engine-replayed STR-RUNUP events 2018-2026 (entry fixed at entry_offset=-14), and the exposure it selects from is materially better than the ungated base. The three disagreeing base numbers (plan +3.9% citing EXP-048; engine replay +1.02%; registry gate eval -1.24% over OOS 2020-2026) are reconciled as a required output. Falsified if the gated OOS mean is not positive, or if the reconciliation shows the +3.9% figure came from a universe the engine spec cannot reproduce."
type: confirmatory
