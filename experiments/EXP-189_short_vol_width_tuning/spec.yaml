id: "EXP-189"
title: "Production short-vol width tuning (M0 only)"
hypothesis: "A multiple k of production's forecast_sizing width rule (k = 1 is production) earns more on the seven put-side short-vol structures than k = 1."
type: "decision_rescore"
strategy: "*"
design: "guides/size_width_tuning_design.md"
preregistered_at: "2026-11-23T12:00:00+00:00"
constraints:
  - "No edit to engine/forecast_sizing.py, STRUCTURES, any SIZE search module, or any file in source_closure of experiments/size_panel.py."
  - "No EXP-188 edit; size_pnl_* modules are imported unchanged."
  - "No call-side short leg."
  - "Marks only from engine.fills."
  - "Holdouts only through the shared admission."
  - "--no-ledger for non-recorded runs."
  - "One heavy job at a time."
model:
  id: "M0"
  model: "production size_v1_4"
structures: ["TWIN-P", "TWIN-P5", "CND-PS", "BFLY-P", "BFLY-P5", "RAMP7", "CTR5"]
grid:
  k: [0.5, 0.67, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.5, 3.0]
  edge_rule: "argmax at 3.0 or 0.5 is k_at_edge, not frozen"
arms:
  - id: "A"
    name: "global"
    description: "one k for all seven structures, tuned on M0's real 2023-24 P&L"
  - id: "B"
    name: "per_structure_real"
    description: "seven k_s, tuned on M0's real 2023-24 P&L (one path)"
  - id: "C"
    name: "per_structure_fake"
    description: "seven k_s, tuned on a fake forecast matching M0's error profile, N = 20 seeded draws"
  - id: "D"
    name: "two_factor"
    description: "k_T for the TWIN pair (TWIN-P, TWIN-P5) and k_C for the five centre-peaked structures, tuned on M0's real 2023-24 P&L"
  - id: "E"
    name: "expected_pnl"
    description: "no tuning; per event, k from the grid maximising exp_pnl_sim for that structure"
  - id: "anchor"
    name: "oracle_sweep"
    description: "descriptive only; forecast equals actual move"
fake:
  N: 20
  seed_tag: "exp189-v1"
  calibration_tolerance: 0.05
account:
  start_equity: 200000
  cap: 0.66
  target_share: 0.25
  expensive_first: true
  secured: "strike x 100"
  policy: "EXP-188 Amendment 2 margin.simulate unchanged except start_equity"
objective: "stand-alone cash-secured $200,000 account return at marks_mid (alpha 0.5), averaged over draws for C"
tie_rule: "within one standard error of the best: k nearest 1, then the smaller"
min_trades: 300
windows:
  inner_years: [2023, 2024]
  outer_year: 2025
  burn_in: "scoring from 2023H2"
success_rule: "(a) the seven-structure $200,000 account return at marks_mid beats production's (k = 1) in each of 2025, 2023H2 and 2024; (b) breakeven alpha is at most production's + 0.05 in 2025; guard: not losing to production in more than 2 of 7 structures in 2025."
tolerance_bands:
  phi: [0.80, 0.90, 0.95]
fallback:
  rho_step: 0.05
  min_recovered_trades: 100
amendments:
  - id: "A1"
    title: "Amendment 1 (2026-11-25): fair-value fills (model F); post-hoc revision by the user, guides/size_width_tuning_design.md, section 'Amendment 1'"
    post_hoc: true
    post_hoc_note: "Chosen by the user on 2026-11-25 after the full mid-fill run (its 2023-24 tuning and 2025 results) had been seen. Not a pre-registered test; nothing in it is blind. The original fields above, PLANNED row, receipts, report and ledger rows stay as the only pre-registered result."
    label: "POST-HOC (Amendment 1, F fills)"
    supersedes:
      constraints: "'Marks only from engine.fills.' is superseded for model F only; engine/fills.py is unchanged and produces the reported views."
      objective: "F replaces marks_mid wherever it decides: the stand-alone cash-secured $200,000 account funded at debit_F with exits at proceeds_F, with F's conservative exits (design A1.2, A1.5). Selection scores use exp_pnl_sim with entry cost debit_F; the simulated exit has no F concession or fair value (A1.3)."
      success_rule: "Condition (a), the 2-of-7 guard, the tolerance bands, phi and fallback adoption read F P&L. Condition (b) and the 12.4 margin keep breakeven alpha and +0.05, on the arm's F-selected taken set, all five alphas priced by a separate CurrentFills instance with repriced=True (A1.6)."
    reported_never_deciding: ["mid", "harsh", "unknown0", "unknown1", "midfloor"]
    fill_model:
      id: "F"
      design: "guides/fair_value_fill_design.md"
      fvf_id: "735f3e6cb2fa65c303599152cfa6fead2d7950e9bcb367117d50ed25faffc0b7"
      carry_dividend_mode: "f7_orats_borrow_discrete_dividend"
      rate_rules:
        rate_out_of_range: "missing"
        rate_empty_row: "rate_unknown"
      vol_scale: 1.0
      rate_scale: 0.01
      reingest:
        path: "data/experiment/orats_smoothed_vol_v4"
        tool_version: "4"
        manifest_sha256: "17ecc75e84d2e261900eccc3ad79a1cbd065af2d58eabdfebfd49dd75001f75d"
        manifest_units:
          iRate5wk: "percent"
          iRateLt: "percent"
          borrow30: "percent"
          borrow2yr: "percent"
          divAmt: "dollars_per_share"
          annIdiv: "dollars_per_share"
          annActDiv: "dollars_per_share"
          divDate: "date"
          assetType: "code"
      quote_snapshot: "the snapshot the sealed inputs pin (design A1.3): the sources config's snapshot_id; no substitute"
      receipt_bindings: ["fill_model_id", "fvf_id", "reingest_manifest_sha256", "every_table_file_sha256", "quote_snapshot_id", "units", "rate_out_of_range", "rate_empty_row", "carry_dividend_mode"]
  - id: "A2"
    title: "Amendment 2 (2026-11-27): mid-anchored fill model A is primary, spread050 is its sensitivity; post-hoc revision by the user. This entry is the amendment's design text."
    post_hoc: true
    post_hoc_note: "User-approved on 2026-11-27, written AFTER Amendment 1's results had been seen, and model A was fitted on the user's own fills. Not a pre-registered test; nothing in it is blind. The original fields, the A1 entry, and their PLANNED rows, receipts, reports and ledger rows are not edited or deleted. If recommendations differ between the runs, each is stated."
    decisions_by:
      user: "the amendment: model A primary, spread050 sensitivity, verdict read on model A with spread050 beside it, disagreement reported as sensitive to wide-leg cost"
      supervisor: "2026-11-27, the supervisor's judgement within the user's model-A decision: how spread050 runs and when it is required, the definition of disagreement, the comparison with F, the fill-date disclosure, the guard reason name, the model A source hash, raw exit rows, and the three PLANNED rows"
    changes: "The fill model only. In the primary run, model A replaces F (Amendment 1) as the selected fill model: wherever Amendment 1 says F, debit_F or proceeds_F decides something, read the model A value. Everything else Amendment 1 had stays."
    unchanged: ["arms", "k grid", "fake N and seeds", "M0 and the fake's calibration", "windows and periods", "account policy", "objective and selection rules", "tie and edge rules", "min_trades and min_recovered_trades", "success rule, breakeven-alpha margins and the 2-of-7 guard", "tolerance bands, phi and fallback adoption", "T-tests and report tables", "mid and harsh views", "no-ledger smoke", "stage order and run outputs"]
    fill_model:
      id: "A"
      fvf_id: "735f3e6cb2fa65c303599152cfa6fead2d7950e9bcb367117d50ed25faffc0b7"
      carry_dividend_mode: "f7_orats_borrow_discrete_dividend"
      rate_rules:
        rate_out_of_range: "missing"
        rate_empty_row: "rate_unknown"
      vol_scale: 1.0
      rate_scale: 0.01
      reingest:
        path: "data/experiment/orats_smoothed_vol_v4"
        tool_version: "4"
        manifest_sha256: "17ecc75e84d2e261900eccc3ad79a1cbd065af2d58eabdfebfd49dd75001f75d"
        manifest_units:
          iRate5wk: "percent"
          iRateLt: "percent"
          borrow30: "percent"
          borrow2yr: "percent"
          divAmt: "dollars_per_share"
          annIdiv: "dollars_per_share"
          annActDiv: "dollars_per_share"
          divDate: "date"
          assetType: "code"
      quote_snapshot: "the snapshot the sealed inputs pin (design A1.3): the sources config's snapshot_id; no substitute"
      model: "mid-anchored: c = min(1, C_BASE + C_SPREAD*min(s/SPREAD_SCALE, 1) + C_THIN_SIZE*thin_size + C_THIN_OI*thin_oi), where s is the quote's relative spread and thin_size and thin_oi are F's thin-liquidity terms (guides/fair_value_fill_design.md, section 5; unknown liquidity takes UNKNOWN_THIN); on the effective quote a buy fills at mid + c*half_spread and a sell at mid - c*half_spread; no fair value, minimum concession or tick rule"
      code: "experiments/fair_value_apply.py (load_constants, leg_fills, structure_entry, structure_exit)"
      constants_file: "experiments/EXP-189_short_vol_width_tuning/model_a_constants.json"
      constants_sha256: "494b21325983821ec1f018e2d04630109284532b7b9d617a5a2e803c9dd4d95a"
      constants_id: "22e1bc6823ee05ffd3b08130c39f9b48a9c22364e0e256d7482bb4ecb19d67fb"
      primary_variant: "primary"
      sensitivity_variant: "spread050"
      f_inputs: "Model A reuses Amendment 1's F leg table, inputs and pins; the fields above repeat Amendment 1's values, and fvf_id is unchanged. The run takes the same --f-pins and --f-quotes inputs and chain reader. Leg statuses are F's, so rate_unknown and no_fair_value still apply although a model A fill uses no fair value."
      entry_exit_binding: "Option B of issue 3104: the entry and exit leg tables each carry constants_id and variant; both must equal the run's pinned values. experiments/size_width_a_fills.py (AFills) refuses legs_unbound or legs_constants_mismatch at entry and at exit unless every leg row carries the pinned pair."
      entry_guard:
        reasons_in_order: ["f_unpriceable", "f_rate_unknown", "f_no_fair_value", "f_not_a_debit", "f_fill_over_mid", "f_spread_over_debit"]
        note: "f_fill_over_mid (model A debit minus the mid debit above 0.25 of the mid debit) is model A's reason, counted by the code for the model A guard's fill_over_mid outcome; f_fill_over_fair stays F's, and F is unchanged. f_not_a_debit still tests the mid and fair-value debits."
      exit: "Amendment 1's exit rules with model A fills; a fallback leg takes the model A fill at its effective mid and keeps exit_fair_mid."
      reported_never_deciding: ["mid", "harsh", "unknown0", "unknown1", "midfloor (equals the base under model A, since c is never negative)"]
      selection: "The code reads fill_model carriers in amendment order: one, or exactly F then A, which selects A. Amendment 1's entry stays."
    fit_disclosure:
      note: "Fitted on the user's own fills: 146 near-close unflagged fills. Hashes, counts and losses only; no fill-level data is committed. Losses are in-sample, measured on the fills used to fit."
      input_sha256: "e06646be7fe09eb164e947dea0b64d05f59234bc62931d55c0e337a26a0f4fb0"
      base_fvf_id: "735f3e6cb2fa65c303599152cfa6fead2d7950e9bcb367117d50ed25faffc0b7"
      window_minutes: 60
      counts: {rows: 413, used: 180, unflagged: 146, oi_only: 19, size_only: 8, both: 7, unknown: 0, outside_window: 228, unpriceable: 0, rate_unknown: 2, no_fair_value: 3, zero_half_spread: 0, borrow_cells_out_of_range: 0, rate_cells_out_of_range: 0}
      fit:
        unflagged: {n: 146, fitted: true, loss: 0.896096258132475}
        oi_only: {n: 19, fitted: false, loss: 0.7181021846860469}
        size_only: {n: 8, fitted: false, loss: 1.2533928571428548}
      kept_constants: "Both thin penalties keep F's values (0.15 size, 0.10 open interest): too few flagged fills to fit."
      unflagged_mean_abs_error: {model_a: 0.896096258132475, current_F: 0.9811597883271139}
      bias: "Model A's mean residual on the unflagged fills is about 0."
    fill_dates: "The fills used to fit model A all postdate every EXP-189 test period (2023H2, 2024, 2025): no overlap."
    fill_dates_exception: "The exact date range is withheld as private (the user's account data), a stated exception to section 9 of guides/fair_value_fill_design.md (supervisor's judgement)."
    causality_limit: "Because those fills postdate every test period, the constants use information that was not available at any decision date in these runs."
    spread050:
      how: "A SEPARATE full run of all stages, with its own entry guard, scores, k tuning, fallback and recommendation, in its own fresh out-dir. spread050 replaces only C_SPREAD (0.50) under the same constants_id."
      run_option: "run.py --fill-variant spread050 (primary is the default); it needs --f-pins and --f-quotes, and is recorded in the receipts as fill_model.variant."
      required_when: "REQUIRED only if the primary (model A) run gives any adoption-relevant pass: any arm passes, or the recommendation changes the board. When required, the amendment's result is not final until it has run."
      otherwise: "If the primary passes nothing, spread050 is optional and, if not run, is reported as not run. Reason (supervisor's judgement, not a proof): spread050 adds cost on every leg with a spread, up to the cap, not only on wide legs, and never lowers a leg's cost, so it is not expected to rescue the primary."
      verdict: "The verdict is read on model A, with spread050 shown beside it."
      disagreement: "Any difference in the recommendation or in any arm's pass or fail. Then the result is reported as sensitive to wide-leg cost."
      outputs: "Two reports, one per run, plus a short comparison of them."
      comparison: "A Markdown table written by hand at report time: for each run, the recommendation and each arm's pass or fail, and whether the runs disagree. It is a report, not a stored run artifact (supervisor's decision)."
    f_comparison: "F is not re-priced by this amendment. Its code, fvf_id and the A1 entry are unchanged, and model A's results are compared with Amendment 1's stored report. The two runs' taken sets can differ, so the comparison is between whole runs, not trade by trade."
    exit_concession: "Amendment 1's exit-concession diagnostic is measured from F's fair value, which no model A fill uses. No model A statistic is defined: the inputs are stored raw (exit_rows_artifact), any statistic is computed at report time, and it never blocks a run."
    exit_rows_artifact:
      tables: "F's raw report-row tables, written by experiments/size_width_f_store.py for the inner and outer stages: legs_NNNN (one row per positive-quantity leg; exit legs have point = exit) beside taken_NNNN (the taken rows and their arm) A model A run adds the columns below."
      existing_columns_used: ["point", "event_id", "structure", "k", "side", "qty", "mid", "eff_bid", "eff_ask", "V", "status", "c_buy", "c_sell", "fill_buy", "fill_sell"]
      model_a_values: "In a model A run, c_buy, c_sell, fill_buy and fill_sell hold model A values; the fill columns are null on a leg whose status is not ok."
      added_columns: {legs_NNNN: ["constants_id", "variant"], taken_NNNN: ["constants_id", "variant", "exit_value_at_eff_mid"]}
      other_exit_inputs: "The existing taken_NNNN columns proceeds_F, debit_F, exit_value_at_v, excluded_rung3 and excluded_unpriceable, and the legs' eff_bid, eff_ask, c_buy, c_sell and status."
      producer: "S1, the first code slice (size_width_f_store)."
    label: "Every Amendment 2 table and proposed_rule.json carries a label marking it post-hoc under Amendment 2. The report slice (S3) defines the exact string; it changes no result."
    receipts:
      binds: ["every Amendment 1 receipt binding", "the fill-model id", "constants_id", "the variant", "the constants file hash as loaded", "a hash of the model A source, because neither fvf_id nor constants_id covers the apply code"]
      field_names: "Under the inputs receipts' fill_model key, and so under inputs_hash: Amendment 1's binding fields, with fill_model_id A, plus constants_id, variant and model_a_source_sha256. constants_file_sha256 is at the top level of each stage's inputs receipt, outside inputs_hash, and is not compared across stages."
      model_a_source_files: ["every experiments/size_width_*.py", "experiments/fair_value_apply.py", "experiments/fair_value_constants.py", "experiments/size_pnl_shortvol.py"]
      constants_file_hash: "The loaded file's hash is recorded as constants_file_sha256. A hash that differs from constants_sha256 is recorded, not refused (supervisor's decision): load_constants already refuses any change to the constants themselves, so only a reformatting can differ."
    failure_semantics:
      R1_inputs: "Amendment 1's input refusals are unchanged. When the run opens: the existing F input checks and carry_dividend_mode; then constants_unreadable (not a readable regular file), input_too_large (over 64 KiB; RESOURCE_LIMIT_EXCEEDED), constants_unreadable (not JSON), constants_invalid, constants_id_mismatch, variant_unknown; then input_too_large for a model A source file over 1 MiB; then the manifest and snapshot checks; all before any quote read or write. A variant other than primary with F refuses fill_variant_unexpected. Entry and exit refuse legs_unbound, then legs_constants_mismatch; exit first repeats the constants refusals and F's leg checks. A report whose inputs do not bind the selected model refuses f_report_unbound. Other refusals are EXPERIMENT_IDENTITY_CONFLICT; nothing is imputed."
      R2_limits: "Amendment 1's bounded run and resource refusals are unchanged. No partial report after any refusal or late failure."
      R3_determinism: "Model A adds no randomness."
      R4_receipts: "Receipts bind what was loaded (receipts.field_names); a change under inputs_hash refuses at replay. The constants file hash is recorded only; constants_id refuses any change to the constants. Receipts from another fill model or variant are never reused."
      R5_identity: "A constants_id or variant that differs from the run's pinned values refuses. A model A run never prices on F or current marks as primary."
      R6_causality: "Amendment 1's entry and exit date rules are unchanged; the constants are fixed before the run. See causality_limit."
      progress: "Stage, load and pricing progress goes to stderr as under Amendment 1."
    split_list:
      note: "Follow-up code slices, in the supervisor's split of 2026-11-27 (code first and primary end to end; spread050 and report work as later slices if they do not fit, and spread050 fit in S1; this spec slice in parallel). Sizes are the spec owner's estimates: added production lines / test lines / doc words. Every slice is under the CodeRabbit waiver (at most 149 production lines)."
      slices:
        - id: "S1"
          scope: "Walking skeleton through the real driver: select model A from this entry, load the pinned constants, price entry and exit, bind receipts, the --fill-variant option for both variants, end-to-end tests; and the two added raw-row columns."
          files: "run.py, size_width_{driver,f_select,f_quotes,f_fills,f_counts,f_store}, size_width_a_fills"
          estimate: "~140 / ~200 / ~150 (built and merged as pull request 3133)"
          after: "none"
          failure_semantics: "R1: failure_semantics.R1_inputs, constants checked before any quote is read. R2: no partial out-dir results or report after a late failure. R3: no randomness added. R4, R5, R6: as in failure_semantics; progress to stderr."
          artifacts: "inputs and stage receipts (receipts.field_names); raw exit rows (exit_rows_artifact)"
        - id: "S3"
          scope: "Report end of the path: the report stage accepts a model A out-dir (issue 3132), with the Amendment 2 label and any exit statistic computed from the raw rows. The comparison is hand-written, not code."
          files: "size_width_report, size_width_f_views and the size_width_f_report modules"
          estimate: "~80 / ~120 / ~60"
          after: "S1"
          failure_semantics: "R1: inputs not bound to this registration and fill model refuse before anything is written. R2: no partial report. R3: deterministic. R4, R5: reads only bound receipts. R6: reads no sources. A statistic that is not defined never blocks the report. Until S3 is on main the report stage refuses a model A out-dir."
          artifacts: "REPORT.md and proposed_rule.json (Amendment 1's schemas, new label)"
      open_questions: "None. The supervisor's decisions of 2026-11-27 and the first code slice settled them."
    open_issues:
      - "Issue 3091 (the replay donor pool ignores label availability, so exp_pnl_sim and the trailing cutoff may use slightly late donors) is NOT addressed by this amendment and stays open."
    registration:
      planned_rows: "Three EXP-189 PLANNED rows: the original, Amendment 1 and this one, last. The supervisor appends the third after this entry, the model A code (with its raw-row columns) are on main. No agent writes experiments/LEDGER.csv."
      smoke: "Amendment 1's no-ledger smoke (design A1.9 step 3: the same 50-ticker rule, all stages, fresh /tmp out-dir), run under model A before the full run. No smoke result tunes a constant or a rule."
      full_run: "All stages in a fresh out-dir; no earlier receipt, month file or tuning is reused or deleted."
label_2025: "2025 NOT blind for widths"
