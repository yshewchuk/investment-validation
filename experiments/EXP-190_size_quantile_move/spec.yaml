id: "EXP-190"
title: "Earnings-move quantile model (Stage A) and its trading test (Stage B)"
hypothesis: "Can one model beat production's per-event |move| distribution?"
type: distribution_skill
strategy: "*"
price_source: "none in Stage A; Stage B: fill model F (stage_b.fill_model)"
design: "guides/size_quantile_move_design.md"
data_snapshot: "sealed SIZE v14 panel and records, read by content hash, bound by Q2"
preregistered_at: null

constraints:
  - "Nothing enters STRUCTURES, the registry or the board"
  - "No holdout reads: shared population admission first, labels by admitted event key only; --no-ledger for non-recorded runs; one heavy job at a time under bounded_run"

target: {column: abs_move, units: percent_points, lead: 1}
levels: [0.1, 0.25, 0.4, 0.5, 0.6, 0.75, 0.9]
note: "every quantile uses numpy's default linear method; no coverage guarantee. The 500-event minima (calibration, S z_q, level_width_L, B2 donors), the 30 tail donors (user, 2026-11-26) and min(20, n // 100) L bins are pre-registered judgement values: no derivation or study supports them; fixed before any quantile-model run"
features:
  panel: "sealed v14 SIZE panel"
  set: HMOSXLP
  m0_forecast_is_feature: false
  missing: "native NaN"
  row_masks: "v14's"
  dictionary: "hash binds to sealed v14 plan; nothing rebuilt"

walk_forward:
  folds: "annual; refit yearly per level and configuration"
  range: "Y0 through 2025"
  y0_rule: "earliest year where every year Y0..2025 has at least chain_share_min admitted panel events with stored entry and exit option chains, and at least training_years_min earlier calendar years of training rows. A year counts only with at least one label training_labels qualifies (usable labels, after v14's label-end cutoff and embargo; user, 2026-11-26); these label reads are allowed before registration. A year whose annual_folds raises POPULATION_COLLAPSED fails the test and does not refuse the report. No year qualifies: refuse, reason y0_none, no fits, no report"
  y0_late: "user, 2026-11-27: Y0 after 2023 keeps the full run's refusal stage_a_years_invalid (after run_inputs.json, before any fit): no fits, report or verdict; the smoke path does not make this check. The supervisor runs the Y0 report before the PLANNED row (experiments.size_quantile_y0.y0_report, a library call with no command line); if Y0 is after 2023, stop and return to the user, no registration; the guard does not enforce this stop, it is a supervisor step only"
  chain_share_min: 0.45
  chain_share_min_disclosure: "chain_share_min lowered from 0.50 (a judgement value set before coverage was counted) to 0.45 by the user on 2026-11-27, before registration, after the Y0 coverage count (2023 at 47.7%). No outcome or score was read. The gap is a capture-scope limit: ORATS holds 47 of 50 sampled missing chains, and a chain backfill is planned separately."
  training_years_min: 3
  label_rule: "training row needs label available before fold cutoff (data dates, never computed_at)"
  check: "Q2 prints per-year counts and Y0 before any fit; refuses unless rule reproduces sealed 2023-2025 training ids"

arms:
  Q: {role: eligible, rule: "one quantile HGB per level and fold, sorted, then causally calibrated"}
  Q_raw: {role: eligible, rule: "one quantile HGB per level and fold, sorted, floored at 0, uncalibrated"}
  S: {role: reported, can_pass: false, rule: "q = median + scale * z_q. Both HGBs use the configuration grid.selection chooses for year Y; S runs no selection of its own. Median: absolute_error HGB. Scale: second HGB, loss absolute_error (conditional median), on out-of-fold |y - median| in year-blocked expanding folds within training rows; every training-row year that has an earlier training row gets out-of-fold predictions, from a fit trained only on labels available before that year. scale = max(scale, 0.5) both when standardising and in q; report MUST print, per year, the share of events where this floor binds (distribution_tails' binding-share report). z_q from S's own earlier out-of-sample standardised residuals ((y - median) over the floored scale), labels available before cutoff (start of month m); trailing 12 months, refreshed monthly (same as Q); at least 500 events, else unscored (scale_burn_in); Y0 unscored. Raw = median + scale * z_q; scored after sort and floor at 0; crossing rate on raw."}

grid:
  axes: {max_leaf_nodes: [7, 15], min_samples_leaf: [300, 1000]}
  fixed: {learning_rate: 0.03, l2_regularization: 10.0, max_iter: 3000, early_stopping: true, validation_fraction: 0.1, n_iter_no_change: 10, tol: 1.0e-07, random_state: 0}
  selection: "one configuration for all levels. Year Y: lowest event-weighted mean 7-level pinball of raw sorted outputs over out-of-sample years Y0..Y-1, counting labels available before Y's cutoff. Y0 uses leaves 7, leaf 300. Ties: fewer leaves, then larger leaf."

non_crossing: "sort the seven outputs per event; Q_raw is the sorted output floored at 0"
calibration:
  frequency: monthly
  window_months: 12
  min_events: 500
  method: linear
  rule: "pool: out-of-sample events dated in the window_months before month m begins, labels available before m began; each at its own year's chosen configuration (what was actually forecast). delta_q is empirical q-quantile of signed errors y - qhat_q on sorted, unfloored predictions (never floored first); add delta_q to unfloored qhat_q, sort, then floor at 0. Under min_events: unscored (calibration_burn_in)"
distribution_tails:
  min_donors: 30
  floor: 0.5
  interpolation: "inverse CDF linear between knots, per arm from its own predictions"
  rule: "tail pool fixed at start of each month (calibration pool's events rule). Above 0.9: d = (y - q90) / max(q90 - q50, floor) over donors with y > q90; Q(u) = q90 + s_hi * quantile(d, (u - 0.9)/0.1). Below 0.1: d = (y - q10) / max(q50 - q10, floor) over donors with y < q10; Q(u) = max(0, q10 + s_lo * quantile(d, u/0.1)). Event's own s_hi = max(q90 - q50, floor), s_lo = max(q50 - q10, floor). numpy linear; a jump at the knots is allowed. Under min_donors in a tail: tail_pool_thin removes the event from that arm's CRPS ONLY; it keeps its quantiles and stays scored on every other metric and rule, level-width history included (user, 2026-11-26); the report counts CRPS exclusions per arm and year"
  floor_report: "0.5 floor is a user decision (2026-11-26: keep 0.5 floor and report): report MUST print, per arm and year, the share of events where the 0.5 floor binds, for the event width and for the donor normalisation; for arm S also the scale-floor share (arms.S)"
zero_median:
  threshold: 1.0e-09
  rule: "ratio over q50 (W / q50) undetermined when q50 <= threshold: counted zero_median, never 0/0; quantiles stay valid."

baselines:
  B0: {name: "production forecast + ResidualPool (bar)", rule: "stored tier-4 pred_abs_move; full-history ResidualPool, strictly earlier, from eligible donors only (baselines.donor_eligibility); quantiles of max(f + err_move, 0) over the exact rows draw samples: forecast bucket, or whole earlier pool when bucket under MIN_POOL; refused draw unscored"}
  B1: {name: "M0 with v14 band", rule: "size_distribution.v1 residual-ratio band, max(f, 0.05) * Q_q(y / max(pool_f, 0.05)), parity-tested at shared levels; monthly M0 donor pool, labels before the month, full history; user decision (2026-11-26): the v14 bucket rule: v14 quintile buckets of the forecast with the 20-row floor, below which the event is unscored (pool_too_small)"}
  B2: {name: "option-implied", rule: "panel implied_move times trailing earlier quantiles of y / implied_move: trailing 12 months, at least 500 donors, anchored at month start with labels before it; donors with null, zero, negative or non-finite implied_move dropped and counted; event abstains if its own is invalid"}
  B3: {name: "best v14 point model, own pool", rule: "sealed lead-1 predictions of M3 (v14 MAE winner, per sealed selection record); B0's construction on M3's own strictly earlier residuals (from 2023). If M3 lacks HMOSXLP, lowest inner-MAE HMOSXLP candidate with stored predictions; missing year: not_testable; donors filtered by baselines.donor_eligibility"}
  donor_eligibility: "B0 and B3 residual-pool donors, Stage A (user, 2026-11-27): a donor counts only if its label's available_as_of_date is on or before the target's lead-1 decision date (the source_session_ceiling of the sealed target's horizon-1 forecast); data dates, never computed_at; still strictly earlier by event date. Filter before the pool is formed, so bucket edges, the MIN_POOL fallback and sampled rows use eligible donors only; a pool then too small is the same refused draw (unscored, counted). A target without that date refuses EXPERIMENT_IDENTITY_CONFLICT before any fit; no report. Experiment-side only: experiments/size_pnl_pool.py, engine/pnl_sim.py and EXP-188/189 files do not change"

stage_a:
  min_scored_share: 0.80  # per period/arm; below: not_testable (scored_share_below_floor); always reported
  settlements:
    status: "design section 5, settlements 1-9, apply (accepted by the user as proposed, 2026-11-25; user confirmed 2026-11-26 that this covers the text as written, item 7's addition included); compact copy below"
    s1: "Spearman bootstrap: in a used cell of n events with rank residuals rW, re, each event gets n * rW * re / sqrt(sum(rW^2) * sum(re^2)), 0 in a zero-W cell (L alike); size_pnl_contrast ticker bootstrap on these and on the W minus L per-event difference; ranks and residuals fixed across resamples; seed a parameter, default 188"
    s2: "tercile difference within each cell (top minus bottom tercile mean e), weighted by cell event count; zero-residual cell counts 0; ordered by residual, ties by event id, np.array_split; pooled-event tercile table report only"
    s3: "level-width burn-in removes an event only from conditional tests (W, L, B0 comparison); it stays in accuracy and coverage"
    s4: "min_scored_share per period and arm; denominator all admitted events in the period; numerator admitted events scored by both arm and B0; below: not_testable (scored_share_below_floor); always reported. An admitted in-period event with no qualified label counts in the denominator and is never paired or scored (user, 2026-11-26, option B; no admitted_label_missing refusal); the report counts these per year"
    s5: "a period with no paired event or no usable cell, or a bootstrap with under two groups: arm not_testable; a missing quarter does not count towards a quarter requirement, which stays of 10"
    s6: "cell where e varies but its residual is all zero: skipped for both W and L, own count"
    s7: "L edges: numpy linear quantiles with duplicates removed; a value on an edge goes to the lower bin, earlier and current alike; if ties leave the event's bin with no earlier y: no L (level_width_empty_bin), treated as s3"
    s8: "CRPS uses the distribution_tails rule for every arm; the metric integrates each event's piecewise-linear (u, x) quantile function exactly"
    s9: "crossing rate: share of events where any neighbouring pair of raw quantiles is strictly out of order. For Q too, raw means the unsorted fit outputs (user, 2026-11-26)"
  population: "events where judged arm and B0 both have output; drops counted by reason and year; B1-B3 on common subsets"
  periods: ["2023H2", "2024", "2025"]
  quarters: 10
  baseline_tables: "B1-B3 and S get same tables"
  metrics: "per period, quarter, pooled, per arm: pinball per level and mean; coverage of p25-p75 and p10-p90 (inclusive) and each level; full-distribution CRPS; raw crossing rate; median width q75 - q25; MAE of p50 beside M0's and M3's"
  conditional_tests:
    cells: "quarter x B0's bucket index"
    width: "W = q75 - q25"
    error: "e = |y - q50|"
    skipped: "cells under 30 events or with constant e (counted)"
    residualisation: "ranks of W and e each linearly residualised on q50's rank within cells; W residual of zero (within 1e-9) scores correlation 0 and tercile difference 0"
    tests: "partial Spearman of W and L with e within cells, event-weighted, ticker bootstrap, B0's value beside; W-residual terciles pooled by period (mean e, realised IQR of y, both coverages). Reported only: W / q50 version and unconditional width terciles."
  level_width_L:
    min_events: 500
    bins: "min(20, n // 100) equal-count bins of earlier q50, per month, from arm's own out-of-sample (q50, y) pairs"
    value: "p75 minus p25 of earlier y in event's q50 bin (end bin outside edges)"
    burn_in: "under min_events: event leaves only conditional tests, W, L, B0 (level_width_burn_in)"
    tests: "L goes through same tests on same events and cells as W"
  pass_rule:
    - "accuracy: arm's mean pinball below B0's in each period and in at least 8 of 10 quarters; for per-event difference (arm minus B0), 90% percentile bootstrap intervals by quarter and by ticker lie below 0"
    - "conditional_sharpness: in each period W's partial Spearman positive and exceeds L's, and W's wide-minus-narrow tercile difference in mean e positive and exceeds L's; pooled over periods, ticker intervals for W's Spearman and W minus L both lie above 0"
    - "calibration_guard: for each band, |coverage - nominal| no worse than B0's in at least 5 of 10 quarters"
  bootstrap: {resamples: 10000, interval_percentile: 90, seed: "fixed"}
  flags: "pooled pinball loss to B1, B2 or B3 is flagged in headline, not gated. Each baseline has its own common subset (events scored by the arm, B0 and that baseline), so one baseline's gaps never shrink another's (issue 3042 item 1, owner default, user 2026-11-26)"
  verdict: "Stage A passes if Q or Q_raw passes. Both Q and Q_raw then enter Stage B; only a passing arm decides there (stage_b.arm_roles). Two eligible arms give two tries, uncorrected. Otherwise Stage B not run. With no passing arm, Stage A is not_passed (not_testable stays for a Q_raw fit failure), each arm labelled and reasons listed (issue 3042 item 4, owner default, user 2026-11-26). The Stage A report does not store stage_b_arms."
  selection_period_disclosure: "report states: grid for year Y uses earlier years; B3 identity, feature set, grid values used 2023-2024; Stage A gate uses 2023H2-2025. No feature set, grid value, configuration or baseline identity was selected by scoring 2025 (baselines here are B0-B3; Stage B's control arm E was recommended after its 2025 results were seen). 2025 is not a clean test or holdout: the Stage A gate reads it (Stage B scores it after a pass that read 2025 outcomes), and 2025 results shaped the design, EXP-188's and EXP-189's among them (D15 as revised by the user, 2026-11-26). Only the forward period after data end is independent."
  anchor_disclosure: "calibration, tail, level-width, arm S's z_q, B1 and B2 pools are cut at the start of the event's month, not at each event's decision date, so an event decided before its month anchor can use labels not available at that decision. Annual folds are cut at the earlier of 1 January and every evaluation forecast's source_session_ceiling, so the yearly fits (Q_raw's seven quantiles) have no such gap; Q's monthly calibration and every arm's tails do. B0 and B3 residual pools are cut at the decision date, so the two sides are not cut alike, and for those events this can favour the judged arm. Disclosed, not fixed (user, 2026-11-27)"

failure_semantics:
  R1: "panel, folds, dictionary, M0 or M3 series do not bind: refuse EXPERIMENT_IDENTITY_CONFLICT; nothing rebuilt or imputed. A merely absent M3 year is B3 not_testable. No Y0: refuse, reason y0_none (walk_forward.y0_rule)."
  fit_failed: "fold's arm is fit_failed, no retry. One failed fit (any level or configuration) fails the whole year. The Q walk runs years in order and stops at the first fit_failed year: later years are neither selected nor fitted, so no grid selection reads a failed year; none is skipped or substituted. The walk's source is Q_raw (Q derives from it), so a Q_raw fit failure makes the whole of Stage A not_testable, even for a year before the judged periods. Only a ValueError from fitting is fit_failed; a memory-limit refusal is not: it refuses RESOURCE_LIMIT_EXCEEDED and publishes no receipt for that year. Receipts are published whole or not at all; a rerun replays published ones, fit_failed included. Calibration failure affects Q only. The stop and not_testable rule is a user decision (2026-11-26)."
  abstention: "burn-in (except level-width, see level_width), non-finite output: unscored (an abstention, not 'no'), counted; leaves paired population. A thin tail pool is not an abstention: CRPS only (distribution_tails)."
  baseline_abstention: "B1 pool_too_small; B2 under 500 donors or invalid own implied_move: that baseline is unscored for the event, counted; its common-subset tables drop it. B2 donor with null, zero, negative or non-finite implied_move: dropped from the pool and counted"
  level_width: "burn-in or empty bin: no L, counted; only conditional tests"
  R2: "quarter or year chunks. Memory limit (user decision, 2026-11-26; peak not yet measured): one heavy process on a 13 GiB box; the real-data entry point (experiments/size_quantile_run) wraps the whole run in experiments.memory_guard.rss_watchdog(8 * 2**30): the run's own VmRSS, sampled every 50 ms, above 8 GiB raises MemoryError, refused RESOURCE_LIMIT_EXCEEDED; no partial report, complete fit receipts stay. bounded_run --heavy --max-rss-gb 9 is the untyped backstop above it. No wall-clock limit; receipt byte caps are separate."
  R3_R4: "fixed seeds; receipts atomic, immutable, bound to inputs; changed input refuses"
  R5: "arm ids hash source, level set and configuration"
  R6: "causality: fits, selection, calibration, tail, level-width and baseline pools use data available before fold or month (B0 and B3 residual pools: the stricter decision-date cut, baselines.donor_eligibility); month's predictions written before its labels are read"

code_alignment: "met (audited 2026-11-27): merged code implements the 30-donor CRPS-only tails and unlabelled in-period events (#3068); the Y0 rule with y0_none (#3070), wired into the real-data entry point with the 8 GiB watchdog (#3080); arm S, the B1-B3 tables, the per-baseline headline flags and B3 binding in the entry point (#3087); baselines.donor_eligibility (#3094), with its decision-date refusal before any fit on the full and smoke paths. Month pools need both the label_end+1 and the native availability date. stage_a_verdict's stage_b_arms lists only passing sources: read it as the deciding sources (stage_b.arm_roles: both Q and Q_raw enter Stage B); the report does not store it. No Stage B code is covered: stage_b.f6_amendment.gate still applies"
real_data_order: "SB0 (both parts), then PLANNED row, then 50-ticker smoke (a real-data fit), then full run (user decision, 2026-11-26: registration stays before the smoke). The Y0 report precedes the row (walk_forward.y0_late). Before the row (user decision, 2026-11-26): sealed-record binding, panel and chain counts, Y0 report and training-id parity (with the label reads they need) are allowed; no model fit on real data and no computing of any arm's or baseline's score against realised moves (showing v14's stored metrics is allowed). Those label reads stay under the no-holdout rule: shared admission first, admitted event keys only. They use event id, ticker and label_end, and for usable-label counts whether a qualified abs_move exists; no move value is printed, aggregated or compared with a forecast."

stage_b:
  status: settled  # settled once code_alignment was met; the guard still needs the PLANNED row
  open_decisions: {}  # none open before registration (user, 2026-11-27); f6_amendment.open_until_then is deferred to that amendment
  arm_roles: "user, 2026-11-27: when Stage A passes, both sources Q and Q_raw enter Stage B. A source whose own Stage A verdict is pass is deciding. The other is informational only: its results are reported, labelled informational, and never count toward Stage B's success verdict or any adoption. Only a passing source can give a deciding Stage B verdict. EQ runs only for a passing source. A source without quantiles (Q after a calibration failure) has no results to report"
  f6_amendment:
    gate: "Stage B must not run until the F6 Stage B amendment (F recalibrated from real fills) is in (user, 2026-11-27). SB9b enforces it: stage_b_amendment_pending, before any Stage B read, no output; no merged code does yet"
    open_until_then:
      residual_pools: "whether Stage B's residual pools (P0, W, LW, D, WD, LWD, E, EQ, and ST0's B0 distribution) apply baselines.donor_eligibility; not decided"
  rules_from: "design section 6; decisions in section 10 (D1, D11-D15, N1-N4, F, EQ)"
  runs_if: "only after a bound Stage A pass receipt. Sources s are Q (calibrated) and Q_raw (uncalibrated), each with its own tails; an arm suffixed _s uses only s. Both run, each labelled with its own Stage A verdict and as deciding or informational (arm_roles); EQ runs only for a source that itself passed; f6_amendment.gate also applies"
  machinery: "EXP-188 production-exact rules as a library (its design section 18: strikes through price_structure, no zero-floor drop, entry and exit sessions, spread and market-cap terms, per-arm trailing cutoffs, exit rungs). No size_pnl_* or size_width_* change. Draw key event_id, shared by all arms"
  fill_model:
    id: "F"
    role: "primary for selection and scoring"
    design: "guides/fair_value_fill_design.md"
    fvf_id: "735f3e6cb2fa65c303599152cfa6fead2d7950e9bcb367117d50ed25faffc0b7"
    carry_dividend_mode: "f7_orats_borrow_discrete_dividend"
    rate_rules: {rate_out_of_range: "missing", rate_empty_row: "rate_unknown"}
    vol_scale: 1.0
    rate_scale: 0.01
    reingest:
      path: "data/experiment/orats_smoothed_vol_v4"
      tool_version: "4"
      manifest_sha256: "17ecc75e84d2e261900eccc3ad79a1cbd065af2d58eabdfebfd49dd75001f75d"
      manifest_units: {iRate5wk: "percent", iRateLt: "percent", borrow30: "percent", borrow2yr: "percent", divAmt: "dollars_per_share", annIdiv: "dollars_per_share", annActDiv: "dollars_per_share", divDate: "date", assetType: "code"}
    quote_snapshot: "the snapshot the sealed inputs pin; no substitute"
    receipt_bindings: ["fill_model_id", "fvf_id", "reingest_manifest_sha256", "every_table_file_sha256", "quote_snapshot_id", "units", "rate_out_of_range", "rate_empty_row", "carry_dividend_mode"]
    selection: "debit_F is the entry cost in exp_pnl_sim, in E's and EQ's k choice, in lots and in accounts; debit_F and proceeds_F give every deciding P&L and the selection-model target. The simulated exit inside exp_pnl_sim is unchanged (European, zero rate, no concession)"
    reported_never_deciding: ["mid", "harsh", "unknown0", "unknown1", "midfloor"]
    views: "on the same F-selected taken set: mid is FillModel(0.5), harsh is every leg at alpha 0, entry and exit; the three F sensitivities (F design section 5) per trade and per family account; none decides or breaks a tie"
  guard: "after geometry resolves, a leg not ok or an F guard failure is a counted non-trade for that arm (f_ plus status or guard reason): no score, outside cutoff history, P&L 0; the event stays in the paired population. F's same-skip rule means: statuses and guard depend only on resolved legs and entry-date inputs, so every arm, control, view and sensitivity resolving the same legs of an event gets the same result; arms with other legs may differ. A passing guard has debit_mid and debit_fair above MIN_MEANINGFUL_COST (1e-6) and debit_F at least debit_fair, so a nonpositive debit_F is an f_not_a_debit non-trade and never a selection-model training row"
  exit: "an unpriceable exit leg or exit rung 3 marks the structure at its worst-case payoff (EXP-188 design section 6), labelled exit_unquoted_worst_case; F's exit_fair_mid applies; negative proceeds_F is kept and flagged, not floored; a held trade never leaves"
  universe:
    candidate: "(event, structure); an event for the straddle"
    centre_peaked: ["CND-PS", "BFLY-P", "BFLY-P5", "RAMP7", "CTR5"]
    twin: ["TWIN-P", "TWIN-P5"]
    short_vol_terms: "market cap at least 10e9 and mean relative spread at most 0.25 on stored quotes"
    straddle: "STR-THRU long legs, EXP-188 Amendment 5 universe: market cap at least 1e9, BAD_QUOTE refused at mid cost, no spread term. No call-side short leg"
  take_rule: "unless an arm says otherwise: score (exp_pnl_sim on debit_F; N1, N2 predicted return; ST, ST0 P) at or above trailing_cutoff (6 months strictly before the month, top 20 percent, at least 100 scores) over that arm's own earlier universe scores, per structure"
  rows: "determined: a decision or a counted non-trade (width declined, ladder_too_coarse, F status or guard, outside universe, take rule not met). A needed missing fact (forecast, quantiles, pool, cutoff history, market cap, spread, implied move for ST and ST0, or at geometry resolution an absent strike or unusable entry quote) makes the row undetermined, never no. Each candidate has one paired population, the rows determined by it and all its controls; its account and theirs walk only those rows; drops counted by arm, reason and year; determined share reported, not gated"
  arms:  # width is production's (forecast_params(name, M0) at the pinned commit) unless stated
    P0: "control, production: exp_pnl_sim with M0 and the full-history ResidualPool (donor eligibility: f6_amendment.open_until_then.residual_pools)"
    E: "second control: EXP-189 arm E as pinned in exp189 (per event and structure, the feasible grid k maximising exp_pnl_sim, M0 and its pool), scored under F"
    W: "candidate W_s: width forecast_params(name, Q_s(tau)); entry simulation M0 and P0's pool on the new geometry"
    LW: "control for W_s: width forecast_params(name, kappa * M0); as W_s. kappa: median Q_s(tau)/M0 over the prior 12 months, strictly earlier events with M0 > 0, at least 100"
    D: "candidate D_s: exp_pnl_sim with QuantilePool_s"
    WD: "candidate WD_s: width as W_s, QuantilePool_s"
    LWD: "control for WD_s: width as LW_s, QuantilePool_s"
    TF: "candidate TF_s (twin filter): takes when P0 takes it and R = (q75 - q25)/q50 from s is at or below the median of R over the 6 months strictly before the month, at least 100 values, one R per universe event. Printed, not tested: determined P0-taken rows with R above the median; event id, R, median and P0's decision are stored as raw rows"
    EQ: "candidate EQ_s: arm E's grid and rules, k chosen by exp_pnl_sim with QuantilePool_s over the event's own seven calibrated quantiles and tails (Q_raw: uncalibrated); the wrapped pool, E's, supplies only move ranks and crush errors"
    N1: "candidate N1_s: selection model with quantile features"
    N2: "control for N1_s: the same model without quantile features, on exactly N1_s's rows"
    ST: "candidate ST_s: straddle, take on P = Pr(abs move > implied_move) from s"
    ST0: "control for ST_s: the same rule from B0"
  quantile_pool: "exposes draw and before. draw calls the wrapped pool's draw (same M0 forecast, count, random stream), ranks each drawn err_move u = (rank + 0.5)/n among the draws (ties in draw order; empty passes through) and returns Qinv_event(u) - forecast; err_crush unchanged. D, WD, LWD wrap P0's pool; EQ wraps E's. pnl_sim.expected_pnl unmodified; the fast path matches it within 1e-9 or the run aborts"
  exp189:
    pinned_commit: "4b14a5ed436c133a9a1dcf7bb5ca0246fee95db2"
    design: "guides/size_width_tuning_design.md with Amendment 1"
    amendments: ["A1"]
