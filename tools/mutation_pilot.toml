# Mutation testing (mutmut 3.8.0, pinned in requirements-dev.txt). How to run
# it: tests/README.md, "Mutation-testing pilot" (local) and "Mutation CI".
# Driven by tools/mutation_pilot.py. Every enabled [modules.<name>] is one job
# of the mutmut workflow's matrix (.github/workflows/mutation-mutmut.yml; the
# gremlins matrix in mutation.yml schedules the same modules); a module with an
# `excluded` reason is listed but never run. The CI cache key hashes this file,
# so any edit here restarts every module's incremental state.
#
# `mutate` and `tests` entries are tracked paths or globs (fnmatch: `*` also
# matches `/`); `skip` removes paths from `mutate`. A pattern that matches
# nothing is an error. tests/test_mutation_ci.py checks that every
# engine/v2 file sits in exactly one module.
#
# Each [modules.<name>] mutates only its `mutate` files and runs only its
# `tests` files: never the whole suite (it hangs on this box), never xdist.
# mutmut itself further narrows each mutant to the tests that executed the
# mutated function during its stats pass.
#
# All mutmut state (its `mutants/` tree, .meta results, stats) lives in a
# per-module work copy OUTSIDE the repo: $MUTATION_PILOT_HOME/<name>/, default
# ~/.cache/investing-plan-mutation-pilot/<name>/. The tool refuses a home
# inside the repo or under data/.

# Shared module map: the pytest-gremlins runner (tools/gremlin_pilot.py, and the
# active gremlins workflow .github/workflows/mutation.yml -- mirrored in the
# candidate copy tools/gremlin_workflow_candidate.yml that the gremlins CI
# tests parse) reads THIS file's partition, exclusions, `mutate`/`skip`/`tests`
# expansion and `[defaults]
# deselect` unchanged -- it only changes how the mutants are executed (parallel
# gremlin workers in the repo checkout, not mutmut in a work copy). Keeping one
# map means the exhaustive module-ownership test (tests/test_mutation_ci.py:
# every engine/v2 file in exactly one module) governs both backends. The gremlins
# CI cache key also hashes this file, so an edit here restarts every module --
# the same as for mutmut. mutmut's own settings and its historical triage and
# baselines below are unchanged: the gremlins note is additive.

[defaults]
# Per-mutant timeout. mutmut sets an RLIMIT_CPU of
#   ceil((est_test_seconds + timeout_constant) * timeout_multiplier * 2)
# CPU seconds on each mutant's worker, where est_test_seconds is the measured
# clean runtime of the tests that cover the mutated function. A mutant that
# loops forever is classified "timeout" (counted as killed, as mutmut does).
# mutmut's defaults (1.0, 15.0) allow ~30x; 2.0/5.0 caps a 1 s test set at 30
# CPU-seconds.
timeout_constant = 2.0
timeout_multiplier = 5.0
# Parallel mutant workers. Match bounded_run's --cores. CI overrides it with
# --max-children $(nproc) (4 on a standard GitHub runner).
max_children = 2
# Passed to every pytest invocation both drivers make (mutmut's per-mutant
# pytest calls and gremlin_pilot's gremlins run). NEVER disable pytest-xdist
# here: pytest-gremlins 1.9.0 implements xdist's hooks (pytest_configure_node),
# so `-p no:xdist` aborts collection with a pluggy PluginValidationError
# (unknown hook, CI run 36059422920 -- pytest exit 3, no raw report). xdist
# stays loaded but inert: neither driver passes a pytest `-n`, and gremlins
# parallelizes with --gremlin-workers.
pytest_args = ["-p", "no:cacheprovider"]
# Tests that need data/ or a browser, inside files that are otherwise
# data-free. Deselected in every mutmut pytest call (harmless where the file is
# not selected). Each failed with no data/ on 2026-09-19 (FileNotFoundError on
# data/curated/..., or empty real tables); the browser test needs playwright's
# chromium, which CI does not install.
deselect = [
    "tests/test_v2_data_generic_incremental.py::test_generic_earnings_events_candidate_commits_atomically",
    "tests/test_v2_data_incremental_persistence.py::test_frozen_curated_append_correction_tombstone_and_noop_replay",
    "tests/test_v2_data_incremental_tables.py::test_frozen_curated_tables_use_the_same_merge_rules",
    "tests/test_v2_dashboard_preview.py::test_l02_browser_frame_pins_r1_then_reload_shows_r2",
    # Runs the real engineering gate, which needs a git checkout and system-Python dependencies.
    "tests/test_v2_ops_effect_receipt_collision.py::test_engineering_gate_runs_supervised_and_binds_the_gate_document_not_the_receipt",
    # Runs the real engineering gate, which needs a git checkout and system-Python dependencies.
    "tests/test_v2_ops_effects_graph.py::test_engineering_gate_effect_runs_the_real_gate_excluding_coverage",
]
# Tracked files copied into the work copy (git ls-files of these paths).
# "." is every tracked file, the same tree a CI checkout has (no data/, which
# is never tracked). Tests read more than engine/tests/checks/tools: e.g.
# test_v2_models_training_recipes parses experiments/EXP-169_*/run.py, and
# failed in CI run 35448350995 when only those four trees were copied.
copy = ["."]

