# ops_catalog was one 12-file matrix job and exceeded the mutmut step's
# 330-minute cap (CI run 35950291319). It is split here into four role shards
# so the job-state-machine mutants run as four parallel matrix jobs. Every
# pool test opens its catalog through tests/ops_support.py::catalog(), which
# executes bootstrap.open_catalog (-> catalog, migrations, schema) and builds a
# scheduler.Supervisor, and nearly all drive submit/claim/commit loops: no pool
# test is demonstrably irrelevant to any shard, so all four keep the SAME full
# 22-file pool rather than trading coverage for wall time. mutmut's per-mutant
# stats still narrow each mutant to the tests that executed its function.
# Sharding changes this file's hash, so every module's incremental cache key
# restarts once (a full pass); the old "ops_catalog-" caches are unreachable
# under the new names.
[modules.ops_catalog_store]
