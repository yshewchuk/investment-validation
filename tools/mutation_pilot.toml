# Mutation-testing PILOT (mutmut 3.8.0). How to run it: tests/README.md,
# "Mutation-testing pilot". Driven by tools/mutation_pilot.py.
#
# Each [modules.<name>] mutates only its `mutate` files and runs only its
# `tests` files: never the whole suite (it hangs on this box), never xdist.
# mutmut itself further narrows each mutant to the tests that executed the
# mutated function during its stats pass.
#
# All mutmut state (its `mutants/` tree, .meta results, stats) lives in a
# per-module work copy OUTSIDE the repo: $MUTATION_PILOT_HOME/<name>/, default
# ~/.cache/investing-plan-mutation-pilot/<name>/. The tool refuses a home
# inside the repo or under data/.

[defaults]
# Per-mutant timeout. mutmut sets an RLIMIT_CPU of
#   ceil((est_test_seconds + timeout_constant) * timeout_multiplier * 2)
# CPU seconds on each mutant's worker, where est_test_seconds is the measured
# clean runtime of the tests that cover the mutated function. A mutant that
# loops forever is classified "timeout" (counted as killed, as mutmut does).
# mutmut's defaults (1.0, 15.0) allow ~30x; 2.0/5.0 caps a 1 s test set at 30
# CPU-seconds.
timeout_constant = 2.0
timeout_multiplier = 5.0
# Parallel mutant workers. Match bounded_run's --cores.
max_children = 2
# Passed to every pytest invocation mutmut makes.
pytest_args = ["-p", "no:xdist", "-p", "no:cacheprovider"]
# Tracked files copied into the work copy (git ls-files of these paths).
# Some targeted tests import checks/ (test_phase4_acceptance_independence).
copy = ["engine", "tests", "checks", "tools"]

[modules.no_fit]
why = "One process-wide flag decides whether a legacy fit/train/cache-write may run during scoring; a flipped default or restore silently re-enables fitting in serving."
mutate = ["engine/models/no_fit.py", "engine/v2/models/no_fit.py"]
tests = ["tests/test_v2_models_no_fit.py", "tests/test_v2_models_no_fit_native.py"]

[modules.canonical]
why = "Every receipt, artifact and corpus identity is a content_hash over canonical_json; a number-layout or key-order slip re-keys everything or collides two different values."
mutate = ["engine/v2/foundation/canonical.py"]
tests = ["tests/test_v2_ops_foundation.py", "tests/test_v2_data_contracts.py"]

[modules.frozen_artifacts]
why = "Frozen payoff/residual/recalibration artifacts are accepted by key + content-hash comparison; a weakened comparison accepts a wrong-fold (future-leaking) artifact and prints a plausible number."
mutate = [
    "engine/v2/models/payoff_artifact.py",
    "engine/v2/models/residual_artifact.py",
    "engine/v2/models/recalibration_artifact.py",
    "engine/v2/scoring/native_residuals.py",
]
tests = [
    "tests/test_v2_models_payoff_artifact.py",
    "tests/test_v2_models_residual_artifact.py",
    "tests/test_v2_models_recalibration_artifact.py",
    "tests/test_v2_scoring_frozen_residuals.py",
]

[modules.pnl_sim]
why = "Legacy expected-PnL simulation behind the live gate (exp_pnl_sim/win_sim) and the parity oracle for native scoring; arithmetic slips change the gate decision."
mutate = ["engine/pnl_sim.py"]
tests = [
    "tests/test_pnl_sim_evidence.py",
    "tests/test_v2_scoring_r4_20_infinite_residuals.py",
    "tests/test_v2_scoring_frozen_residuals.py",
    "tests/test_v2_models_residual_artifact.py",
]

[modules.native_payoff]
why = "Native payoff fit, residual bucketing/capping and model-return simulation: pure numpy arithmetic whose output is the scored return distribution."
mutate = ["engine/v2/scoring/native_payoff.py"]
tests = [
    "tests/test_v2_scoring_native_payoff.py",
    "tests/test_v2_models_training_payoff.py",
    "tests/test_v2_models_payoff_artifact.py",
]

[modules.native_analog]
why = "Native analog selection: bucket widening order, population hashing and bootstrap seeding decide which history a row is compared against; an off-by-one silently changes n_analogs and the interval."
mutate = ["engine/v2/scoring/native_analog.py"]
tests = [
    "tests/test_v2_scoring_native_analog.py",
    "tests/test_phase4_acceptance_independence.py",
    "tests/test_v2_scoring_runup_frozen.py",
    "tests/test_v2_scoring_actionable_flags.py",
    "tests/test_v2_scoring_stage_ownership.py",
    "tests/test_v2_scoring_source_inputs.py",
]
