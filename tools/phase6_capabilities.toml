# P6-1 capability declarations, read by tools/phase6_inventory.py.
#
# Discovery (the tool) finds every consumer entrypoint in the source; this
# file says which capability each belongs to, its disposition and owner.
# checks/phase6_inventory.py fails when a discovered entrypoint has no row
# or exclusion, a row lacks a disposition/owner, or a claimed new
# entrypoint or test does not resolve.
#
# Entrypoint references:
#   route:<app> <METHOD> <path>   legacy-app | v2-api | v2-ops
#   view:legacy #/<area>/<view>   view:ui #<route name>
#   control:legacy <element id>   the legacy SPA's filter/picker controls
#   cli:<file> | cli:<prog> <sub> engine.ledger / ops subcommands
#   nightly:legacy <step>         nightly:v2 <stage>
#   action:legacy_<name>          effect:<name>
#   writer:<file>::<symbol>       legacy ledger/report/export/backup writers
#   py:<file>::<symbol>           a callable, checked with ast
#   doc:<file>                    an operator procedure document
#   MISSING                       no v2 path yet (disposition = missing)
#
# Dispositions: native | compatibility-adapter |
#   CLI-with-user-acceptance-needed | missing | dormant-historical
# Owners: P6-2 | P6-3 | P6-4 | P6-5 | P6-6 | 8A | post-cutover
# active = false marks a dormant historical reader, not an official-path
# dependency. interactive = true marks an existing interactive action.

