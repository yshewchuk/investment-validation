# CI test shards: the ONE place that says which CI job runs which test file.
# Read by tools/ci_shards.py (matrix + per-shard file lists) and checked by
# tests/v2/integration/test_ci_shards.py. Same fnmatch convention as
# tools/mutation_pilot.toml: `*` also matches `/`, so "tests/v2/ops/*" covers
# every nested file.
#
# Shards are ORDERED and the first shard whose pattern matches a file owns it.
# The last shard is the remainder: it owns every test file no earlier pattern
# claims, so a new test file or package can never silently fall out of CI.
# On 2026-11-01 main run 41305553745, research remainder totaled 6430 CPU-s.
# Split SIZE, IV and distribution/heavy files into research-d..g (~1240-1400
# CPU-s each). research-h isolates test_size_run_single_collect after PR CI
# measured research-d at 11m14s; keep the cheap files in the research remainder.
# Rebalance by moving files between the explicit lists.
# Earlier, 2026-10-11, before ops-sweep/integration existed (3475 CPU-s total,
# ~3.8x parallel on a 4-core runner): ops ~1224, research ~902, checks ~474,
# rest ~876. Rebalance by moving a pattern; keep every shard under ~15 minutes
# of pytest wall time on CI.
# On 2026-10-18 the remainder `research` shard still ran 8-16 min on main
# (runs 39165980122..39169015848): the three magnitude_search outer/driver_native
# files carry ~80 s module-scoped setups and 30-140 s calls, so they are the
# research-c shard and the remainder is left with the cheap files.
# Runner speed varies ~2x, so the subprocess-driven ops files and the
# bounded-retention test (ops-sweep) and the integration tests (integration)
# each get their own shard.

[[shard]]
name = "ops-sweep"
patterns = [
  "tests/v2/ops/test_gate_sweep.py",
  "tests/v2/ops/test_native_gate_worker.py",
  "tests/v2/ops/test_computed_moves_bounded_retention.py",
]

[[shard]]
name = "ops"
patterns = ["tests/v2/ops/*", "tests/test_v2_ops_*.py"]

[[shard]]
name = "research-a"
patterns = [
  "tests/v2/research/test_magnitude_fitted_model.py",
  "tests/v2/research/test_gate_report.py",
  "tests/v2/research/test_magnitude_search_execution.py",
  "tests/v2/research/test_magnitude_baseline.py",
]

[[shard]]
name = "research-b"
patterns = [
  "tests/v2/research/test_magnitude_history_model.py",
  "tests/v2/research/test_magnitude_history_store.py",
  "tests/v2/research/test_magnitude_search_trials.py",
  "tests/v2/research/test_magnitude_execution_registration.py",
]

[[shard]]
name = "research-c"
patterns = [
  "tests/v2/research/test_magnitude_search_outer.py",
  "tests/v2/research/test_magnitude_search_outer_integrity.py",
  "tests/v2/research/test_magnitude_search_driver_native.py",
]

[[shard]]
name = "research-h"
patterns = ["tests/v2/research/test_size_run_single_collect.py"]

[[shard]]
name = "research-d"
patterns = ["tests/v2/research/test_size_*"]

[[shard]]
name = "research-e"
patterns = [
  "tests/v2/research/test_iv_crush_search_execution.py",
  "tests/v2/research/test_iv_admission_claims.py",
  "tests/v2/research/test_iv_comparison_journal.py",
  "tests/v2/research/test_iv_crush_fit_worker.py",
  "tests/v2/research/test_iv_panel_reuse.py",
  "tests/v2/research/test_iv_registration_budgets.py",
  "tests/v2/research/test_iv_crush_prepare.py",
  "tests/v2/research/test_iv_crush_inputs.py",
  "tests/v2/research/test_iv_crush_cli_boundaries.py",
  "tests/v2/research/test_iv_crush_plan.py",
  "tests/v2/research/test_iv_crush_progress.py",
  "tests/v2/research/test_iv_crush_search_receipts.py",
  "tests/v2/research/test_iv_crush_paired_report.py",
  "tests/v2/research/test_iv_crush_adapter_oracle.py",
]

[[shard]]
name = "research-f"
patterns = [
  "tests/v2/research/test_iv_crush_cli.py",
  "tests/v2/research/test_iv_submission_accounting.py",
  "tests/v2/research/test_iv_crush_fold_inputs.py",
  "tests/v2/research/test_iv_crush_registration.py",
  "tests/v2/research/test_iv_crush_search_plan.py",
  "tests/v2/research/test_iv_crush_comparator.py",
]

[[shard]]
name = "research-g"
patterns = [
  "tests/v2/research/test_distribution_*.py",
  "tests/v2/research/test_v2_prediction_cli.py",
  "tests/v2/research/test_native_outcome_validation.py",
  "tests/v2/research/test_magnitude_panel_contract.py",
  "tests/v2/research/test_magnitude_registration.py",
]

[[shard]]
name = "research"
patterns = ["tests/v2/research/*", "tests/test_v2_research_*.py"]

[[shard]]
name = "integration"
patterns = ["tests/v2/integration/*"]

[[shard]]
name = "checks"
patterns = ["tests/test_checks_*.py"]

[[shard]]
name = "rest"
remainder = true
