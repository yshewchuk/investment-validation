# CI test shards: the ONE place that says which CI job runs which test file.
# Read by tools/ci_shards.py (matrix + per-shard file lists) and checked by
# tests/v2/integration/test_ci_shards.py. Same fnmatch convention as
# tools/mutation_pilot.toml: `*` also matches `/`, so "tests/v2/ops/*" covers
# every nested file.
#
# Shards are ORDERED and the first shard whose pattern matches a file owns it.
# The last shard is the remainder: it owns every test file no earlier pattern
# claims, so a new test file or package can never silently fall out of CI.
# On 2026-10-17 main run 39038193408 the research JUnit summed 3725 CPU-s
# (~16 min wall at ~3.8x); research-a / research-b / research are balanced by
# per-file JUnit time (~1270 / ~1220 / ~1237 CPU-s, ~5.5 min wall each);
# rebalance by moving a file between the explicit lists. Earlier, 2026-10-11,
# before ops-sweep/integration existed (CPU seconds over 3475 total,
# ~3.8x parallel on a 4-core runner): ops ~1224, research ~902, checks ~474,
# rest ~876. Rebalance by moving a pattern; keep every shard under ~15 minutes
# of pytest wall time on CI.
# On 2026-10-18 the remainder `research` shard still ran 8-16 min on main
# (runs 39165980122..39169015848): the three magnitude_search outer/driver_native
# files carry ~80 s module-scoped setups and 30-140 s calls, so they are the
# research-c shard and the remainder is left with the cheap files.
# Runner speed varies ~2x, so the subprocess-driven ops files and the
# bounded-retention test (ops-sweep) and the integration tests (integration)
# each get their own shard.

[[shard]]
name = "ops-sweep"
patterns = [
  "tests/v2/ops/test_gate_sweep.py",
  "tests/v2/ops/test_native_gate_worker.py",
  "tests/v2/ops/test_computed_moves_bounded_retention.py",
]

[[shard]]
name = "ops"
patterns = ["tests/v2/ops/*", "tests/test_v2_ops_*.py"]

[[shard]]
name = "research-a"
patterns = [
  "tests/v2/research/test_magnitude_fitted_model.py",
  "tests/v2/research/test_gate_report.py",
  "tests/v2/research/test_magnitude_search_execution.py",
  "tests/v2/research/test_magnitude_baseline.py",
]

[[shard]]
name = "research-b"
patterns = [
  "tests/v2/research/test_magnitude_history_model.py",
  "tests/v2/research/test_magnitude_history_store.py",
  "tests/v2/research/test_magnitude_search_trials.py",
  "tests/v2/research/test_magnitude_execution_registration.py",
]

[[shard]]
name = "research-c"
patterns = [
  "tests/v2/research/test_magnitude_search_outer.py",
  "tests/v2/research/test_magnitude_search_outer_integrity.py",
  "tests/v2/research/test_magnitude_search_driver_native.py",
]

[[shard]]
name = "research"
patterns = ["tests/v2/research/*", "tests/test_v2_research_*.py"]

[[shard]]
name = "integration"
patterns = ["tests/v2/integration/*"]

[[shard]]
name = "checks"
patterns = ["tests/test_checks_*.py"]

[[shard]]
name = "rest"
remainder = true
